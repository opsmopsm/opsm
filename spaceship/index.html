<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>スペースシップの恋 3D</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@500;700;900&display=swap">
<style>
/* Layout: full-bleed 3D stage; caption card bottom-left, chapter chips on top, controls bottom */
:root{
  --sky:#070b22; --ink:#eef1ff; --dim:#a3aedc; --glow:#7fe3ff; --pink:#ffb3d1; --panel:rgba(10,16,44,.62);
  --font:"Zen Maru Gothic","Hiragino Maru Gothic ProN",sans-serif;
  color-scheme:dark;
}
html,body{height:100%;margin:0;background:var(--sky);color:var(--ink);font-family:var(--font);overflow:hidden}
#stage{position:fixed;inset:0;touch-action:none}
canvas{display:block}
.ui{position:fixed;left:0;right:0;pointer-events:none;
  padding-left:max(14px,env(safe-area-inset-left,0px));padding-right:max(14px,env(safe-area-inset-right,0px))}
.top{top:0;padding-top:calc(12px + env(safe-area-inset-top,0px));display:flex;flex-direction:column;gap:8px}
.title{font-weight:900;font-size:clamp(18px,4.5vw,26px);letter-spacing:.04em;
  background:linear-gradient(90deg,var(--ink),var(--glow) 55%,var(--pink));-webkit-background-clip:text;background-clip:text;color:transparent}
.chips{display:flex;flex-wrap:wrap;gap:6px;pointer-events:auto}
.chip{font:inherit;font-size:12px;font-weight:700;letter-spacing:.06em;color:var(--dim);background:var(--panel);
  border:1px solid rgba(127,227,255,.25);border-radius:999px;padding:5px 11px;cursor:pointer;backdrop-filter:blur(6px)}
.chip.on{color:#06102a;background:var(--glow);border-color:var(--glow)}
.chip:focus-visible,.btn:focus-visible{outline:2px solid var(--pink);outline-offset:2px}
.bottom{bottom:0;padding-bottom:calc(14px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:10px}
.card{display:flex;gap:12px;align-items:center;background:var(--panel);border:1px solid rgba(127,227,255,.2);
  border-radius:16px;padding:10px 14px 10px 10px;max-width:30em;backdrop-filter:blur(8px);transition:opacity .5s}
.card img{width:64px;height:64px;border-radius:12px;object-fit:cover;flex:none;box-shadow:0 0 18px rgba(127,227,255,.35)}
.card .txt{display:flex;flex-direction:column;gap:3px;min-width:0}
.lyric{font-size:12px;color:var(--pink);letter-spacing:.05em}
.line{font-size:clamp(15px,3.8vw,18px);font-weight:700;line-height:1.5}
.ctrl{display:flex;align-items:center;gap:10px;pointer-events:auto}
.btn{font:inherit;font-weight:700;font-size:13px;color:#06102a;background:var(--glow);border:0;border-radius:999px;padding:8px 14px;cursor:pointer;flex:none}
.btn.ghost{color:var(--ink);background:var(--panel);border:1px solid rgba(127,227,255,.3)}
.bar{flex:1;height:6px;border-radius:3px;background:rgba(163,174,220,.25);position:relative;cursor:pointer;min-width:0}
.bar i{position:absolute;inset:0 auto 0 0;border-radius:3px;background:linear-gradient(90deg,var(--glow),var(--pink))}
.time{font-size:12px;color:var(--dim);font-variant-numeric:tabular-nums;flex:none}
[hidden]{display:none!important}
#start{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:14px;
  background:radial-gradient(ellipse at center,rgba(7,11,34,.25),rgba(7,11,34,.7));text-align:center;padding:24px}
#start h1{margin:0;font-weight:900;font-size:clamp(30px,8vw,52px);text-wrap:balance;
  background:linear-gradient(90deg,var(--ink),var(--glow) 55%,var(--pink));-webkit-background-clip:text;background-clip:text;color:transparent}
#start p{margin:0;color:var(--dim);font-size:14px;line-height:1.8}
#start .row{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
#start .btn{font-size:16px;padding:12px 22px}
#flash{position:fixed;inset:0;background:#fff;opacity:0;pointer-events:none}
#end{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;pointer-events:none;opacity:0;transition:opacity 1.2s}
#end div{font-weight:900;font-size:clamp(30px,9vw,60px);color:#fff;text-shadow:0 2px 12px rgba(40,10,70,.9),0 0 24px var(--pink),0 0 48px var(--glow)}
</style>
</head>
<body>
<div id="stage"></div>
<div id="flash"></div>
<div id="end"><div>スペースシップの恋</div></div>

<div class="ui top">
  <div class="title">スペースシップの恋</div>
  <div class="chips" id="chips"></div>

<div class="ui bottom">
  <div class="card" id="card"><img id="pic" alt="スペ恋ちゃん"><div class="txt"><div class="lyric" id="lyric"></div><div class="line" id="line"></div></div></div>
  <div class="ctrl">
    <button class="btn" id="play">▶ 再生</button>
    <div class="bar" id="bar"><i id="prog"></i></div>
    <span class="time" id="time">0:00</span>
  </div>
</div>

<div id="start">
  <h1>スペースシップの恋</h1>
  <p>西暦2999年、未来の地球から銀河の果てへ。<br>曲に合わせて、お話の世界を3Dで旅します。<br>ドラッグで少しだけ見回せます。</p>

    <button class="btn" id="goSound">▶ 曲といっしょに出発</button>
    <button class="btn ghost" id="goMute">音なしで見る</button>
  </div>
</div>

const flames=[];
for(const s of[1,-1]){const e=new THREE.Mesh(new THREE.CylinderGeometry(.7,.85,1.6,14),white);e.rotation.x=Math.PI/2;e.position.set(s*.9,0,5);ship.add(e);
  const f=sprite(texCyan,3);f.position.set(s*.9,0,6.2);ship.add(f);flames.push(f);
  const tail=new THREE.Mesh(new THREE.ConeGeometry(.6,6,12,1,true),new THREE.MeshBasicMaterial({color:0x7fe3ff,transparent:true,opacity:.55,blending:THREE.AdditiveBlending,depthWrite:false}));
  tail.rotation.x=-Math.PI/2;tail.position.set(s*.9,0,9);ship.add(tail);flames.push(tail);}

// ---------- space world ----------
const space=new THREE.Group();space.visible=false;scene.add(space);
const NS=2600, sp=new Float32Array(NS*3), seg=new Float32Array(NS*6), scol=new Float32Array(NS*6);
const palette=[[1,1,1],[.5,.9,1],[1,.7,.85],[1,1,1]];
for(let i=0;i<NS;i++){let x,y;do{x=(rnd()-.5)*400;y=(rnd()-.5)*400;}while(x*x+y*y<36);
  sp[i*3]=x;sp[i*3+1]=y;sp[i*3+2]=-rnd()*1200;const c=palette[i%4];for(let k=0;k<2;k++){scol[i*6+k*3]=c[0];scol[i*6+k*3+1]=c[1];scol[i*6+k*3+2]=c[2];}}
const segGeo=new THREE.BufferGeometry();segGeo.setAttribute('position',new THREE.BufferAttribute(seg,3));segGeo.setAttribute('color',new THREE.BufferAttribute(scol,3));
const streaks=new THREE.LineSegments(segGeo,new THREE.LineBasicMaterial({vertexColors:true,transparent:true,opacity:.9,blending:THREE.AdditiveBlending,fog:false}));
space.add(streaks);
const dotGeo=new THREE.BufferGeometry();dotGeo.setAttribute('position',new THREE.BufferAttribute(sp,3));
const dots=new THREE.Points(dotGeo,new THREE.PointsMaterial({map:texDot,size:2.4,transparent:true,depthWrite:false,blending:THREE.AdditiveBlending,fog:false}));space.add(dots);

// galaxy
const galaxy=(()=>{const n=9000,p=new Float32Array(n*3),c=new Float32Array(n*3);
  for(let i=0;i<n;i++){const arm=i%3,r=Math.pow(rnd(),1.6)*160,a=arm*2.094+r*.035+(rnd()-.5)*.5;
    p[i*3]=Math.cos(a)*r+(rnd()-.5)*8;p[i*3+1]=(rnd()-.5)*(10-r*.04);p[i*3+2]=Math.sin(a)*r+(rnd()-.5)*8;
    const k=r/160;c[i*3]=1-k*.5;c[i*3+1]=.85-k*.2;c[i*3+2]=1;}
  const g=new THREE.BufferGeometry();g.setAttribute('position',new THREE.BufferAttribute(p,3));g.setAttribute('color',new THREE.BufferAttribute(c,3));
  const pts=new THREE.Points(g,new THREE.PointsMaterial({map:texDot,size:3,vertexColors:true,transparent:true,depthWrite:false,blending:THREE.AdditiveBlending,fog:false}));
  const grp=new THREE.Group();grp.add(pts);const core=sprite(texDot,120,0xffe8c8);core.material.fog=false;grp.add(core);grp.rotation.x=1.1;return grp;})();
space.add(galaxy);
// earth marble (behind the ship)
const earth=new THREE.Group();
const eTex=(()=>{const c=document.createElement('canvas');c.width=256;c.height=128;const g=c.getContext('2d');g.fillStyle='#2a6cff';g.fillRect(0,0,256,128);
  g.fillStyle='#46d18c';for(let i=0;i<26;i++){g.beginPath();g.ellipse(rnd()*256,20+rnd()*88,8+rnd()*26,5+rnd()*14,rnd()*3,0,6.3);g.fill();}
  g.fillStyle='rgba(255,255,255,.7)';for(let i=0;i<30;i++){g.fillRect(rnd()*256,rnd()*128,20+rnd()*40,2);}return new THREE.CanvasTexture(c);})();
const eM=new THREE.Mesh(new THREE.SphereGeometry(5,32,16),new THREE.MeshBasicMaterial({map:eTex,fog:false}));earth.add(eM);
const eg=sprite(texCyan,18);eg.material.fog=false;earth.add(eg);earth.position.set(34,10,70);space.add(earth);
// heart nebula
const heart=(()=>{const n=7000,p=new Float32Array(n*3),c=new Float32Array(n*3);
  for(let i=0;i<n;i++){const t=rnd()*6.283,k=Math.sqrt(rnd());
    const hx=16*Math.pow(Math.sin(t),3),hy=13*Math.cos(t)-5*Math.cos(2*t)-2*Math.cos(3*t)-Math.cos(4*t);
    const edge=i%3===0?1:k;
    p[i*3]=hx*edge*3+(rnd()-.5)*6;p[i*3+1]=hy*edge*3+(rnd()-.5)*6+8;p[i*3+2]=(rnd()-.5)*30;
    const pink=rnd()<.7;c[i*3]=pink?1:.5;c[i*3+1]=pink?.55+rnd()*.25:.9;c[i*3+2]=pink?.8:1;}
  const g=new THREE.BufferGeometry();g.setAttribute('position',new THREE.BufferAttribute(p,3));g.setAttribute('color',new THREE.BufferAttribute(c,3));
  const pts=new THREE.Points(g,new THREE.PointsMaterial({map:texDot,size:3.2,vertexColors:true,transparent:true,depthWrite:false,blending:THREE.AdditiveBlending,fog:false}));
  const grp=new THREE.Group();grp.add(pts);
  for(let i=0;i<14;i++){const s=sprite(i%2?texPink:texCyan,60+rnd()*60);s.material.opacity=.35;s.material.fog=false;const t=rnd()*6.283;
    s.position.set(16*Math.pow(Math.sin(t),3)*2.4,(13*Math.cos(t)-5*Math.cos(2*t)-2*Math.cos(3*t)-Math.cos(4*t))*2.4+8,-10);grp.add(s);}
  return grp;})();
space.add(heart);

// ---------- helpers ----------
const clamp=(x,a,b)=>Math.max(a,Math.min(b,x));
const ease=x=>x<0?0:x>1?1:x*x*(3-2*x);
const seg01=(t,a,b)=>clamp((t-a)/(b-a),0,1);
const V=(x,y,z)=>new THREE.Vector3(x,y,z);
let yaw=0,pitch=0,dragging=false,px=0,py=0;
const st=$('stage');
st.addEventListener('pointerdown',e=>{dragging=true;px=e.clientX;py=e.clientY;st.setPointerCapture(e.pointerId);});
st.addEventListener('pointermove',e=>{if(!dragging)return;yaw=clamp(yaw-(e.clientX-px)*.004,-.9,.9);pitch=clamp(pitch-(e.clientY-py)*.003,-.5,.5);px=e.clientX;py=e.clientY;});
st.addEventListener('pointerup',()=>dragging=false);st.addEventListener('pointercancel',()=>dragging=false);
function look(from,to){camera.position.copy(from);
  const d=to.clone().sub(from);const r=d.length();const yaw0=Math.atan2(d.x,d.z),p0=Math.asin(clamp(d.y/r,-1,1));
  const y=yaw0+yaw,p=clamp(p0+pitch,-1.4,1.4);
  camera.lookAt(from.x+Math.sin(y)*Math.cos(p)*r,from.y+Math.sin(p)*r,from.z+Math.cos(y)*Math.cos(p)*r);}

// ship path in ground world
function shipGround(t){
  if(t<12.5) return {p:V(80,140,-260),vis:false,rx:0};
  if(t<19){const k=ease(seg01(t,12.5,19));
    const a=V(90,120,-300),b=V(30,40,-60),c=V(0,1.6,8);
    const p=a.clone().multiplyScalar((1-k)*(1-k)).add(b.clone().multiplyScalar(2*k*(1-k))).add(c.clone().multiplyScalar(k*k));
    return {p,vis:true,rx:0,ry:(1-k)*1.1,rz:(1-k)*.6};}
  if(t<24.5) return {p:V(0,1.6,8),vis:true,rx:0};
  const s=t-24.5, z=8-12*s*s*s*.5-6*s*s, y=1.6+Math.max(0,s-1.2)*Math.max(0,s-1.2)*9;
  return {p:V(0,y,z),vis:true,rx:clamp((s-1.2)*.35,0,.5)};
}

// ---------- captions & chapters ----------
const chips=$('chips');
CH.forEach((c,i)=>{const b=document.createElement('button');b.className='chip';b.textContent=c.n;b.id='ch'+i;
  b.onclick=()=>{seek(c.t+.01);if(!playing)begin(useAudio);};chips.appendChild(b);});
let capIdx=-1;
function caption(t){let k=0;for(let i=0;i<CAP.length;i++)if(t>=CAP[i][0])k=i;
  if(k!==capIdx){capIdx=k;const c=CAP[k];$('pic').src=IMGS[c[1]];$('lyric').textContent='♪ '+c[2];$('line').textContent=c[3];
    const card=$('card');card.style.opacity=0;requestAnimationFrame(()=>requestAnimationFrame(()=>card.style.opacity=1));}
  let ci=0;CH.forEach((c,i)=>{if(t>=c.t)ci=i;});CH.forEach((c,i)=>$('ch'+i).classList.toggle('on',i===ci));
  $('prog').style.width=(100*t/DUR)+'%';const s=Math.floor(t);$('time').textContent=Math.floor(s/60)+':'+String(s%60).padStart(2,'0');}

// ---------- playback ----------
function begin(sound){useAudio=sound;$('start').hidden=true;playing=true;$('play').textContent='❚❚ 一時停止';
  if(sound){audio.currentTime=T;audio.play().catch(()=>{useAudio=false;});}}
function pause(){playing=false;audio.pause();$('play').textContent='▶ 再生';}
function seek(t){T=clamp(t,0,DUR);if(useAudio)audio.currentTime=T;}
$('goSound').onclick=()=>{T=0;begin(true);};
$('goMute').onclick=()=>{T=0;begin(false);};
$('play').onclick=()=>{if(playing)pause();else{if(T>=DUR-.1)seek(0);begin(useAudio);}};
$('bar').onclick=e=>{const r=e.currentTarget.getBoundingClientRect();seek(DUR*(e.clientX-r.left)/r.width);if(!playing)begin(useAudio);};
audio.addEventListener('ended',()=>{pause();T=DUR;});

// ---------- frame ----------
const tmp=new THREE.Color();
function frame(now){
  const dt=Math.min(.05,(now-last)/1000);last=now;
  if(playing){if(useAudio&&!audio.paused)T=audio.currentTime;else T+=dt;if(T>=DUR){T=DUR;pause();}}
  const t=T, clock=now/1000;
  caption(t);
  const inSpace=t>=31;
  ground.visible=!inSpace;space.visible=inSpace;
  // ambient city motion
  holos.forEach((h,i)=>h.rotation.z=clock*(.5+i%3*.3));
  floaters.forEach((f,i)=>f.position.y+=Math.sin(clock*.8+i)*.02);
  cars.forEach(c=>{const u=c.userData;u.a+=u.sp*dt;c.position.set(Math.cos(u.a)*u.r,u.h,u.cz+Math.sin(u.a)*u.r);c.rotation.z=-u.a;});
  // runway chase lights
  const chase=t<21.5?.6:t<24.5?2+ (t-21.5)*3:14;
  rLights.forEach(o=>{const v=(Math.sin(o.i*.6-clock*chase*2)+1)/2;o.s.material.opacity=.35+.65*v;});
  // throttle
  let thr=t<17?.15:t<21.5?.35:t<24.5?.35+.65*seg01(t,21.5,24.5):1;
  if(t>=34&&t<50)thr=1.6;
  flames.forEach((f,i)=>{const fl=1+Math.sin(clock*40+i)*.08;if(f.isSprite)f.scale.setScalar(3*thr*fl+.5);else{f.scale.set(1,thr*fl*1.4,1);f.material.opacity=.15+.4*Math.min(thr,1);}});

  if(!inSpace){
    // sky gradient while climbing
    const k=seg01(t,26.5,31);
    tmp.copy(NIGHT).lerp(DEEP,ease(k*1.6)).lerp(BLACK,ease((k-.5)*2));
    scene.background.copy(tmp);scene.fog.color.copy(tmp);scene.fog.near=80;scene.fog.far=520;
    skyStars.material.opacity=.6+.4*k;
    const s=shipGround(t);ship.visible=s.vis;ship.position.copy(s.p);ship.rotation.set(s.rx||0,s.ry||0,s.rz||0);
    if(t<12.5){const a=-.6+t*.045;look(V(Math.sin(a)*150,85+Math.sin(t*.2)*6,-110+Math.cos(a)*150),V(0,20,-110));}
    else if(t<21.5){look(V(22,7,26),ship.position.clone().add(V(0,1,0)));}
    else if(t<25.6){look(V(11,2.6,16),V(0,2.2,-6).lerp(ship.position,seg01(t,24.5,25.6)));}
    else{const sh=reduce?0:(Math.random()-.5)*.15;look(ship.position.clone().add(V(sh,5+sh,24)),ship.position.clone().add(V(0,1.5,-20)));}
  }else{
    scene.background.copy(BLACK);scene.fog.near=1e5;scene.fog.far=2e5;
    ship.visible=true;ship.position.set(0,0,0);
    // speed profile
    let speed=t<34?60:t<36?60+1500*ease(seg01(t,34,36)):t<50?1560:t<52.5?1560-1530*ease(seg01(t,50,52.5)):t<84?30:30+400*seg01(t,84,88);
    const len=Math.max(.5,speed*.05);
    for(let i=0;i<NS;i++){let z=sp[i*3+2]+speed*dt;if(z>40)z-=1240;sp[i*3+2]=z;
      seg[i*6]=sp[i*3];seg[i*6+1]=sp[i*3+1];seg[i*6+2]=z;seg[i*6+3]=sp[i*3];seg[i*6+4]=sp[i*3+1];seg[i*6+5]=z-len;}
    segGeo.attributes.position.needsUpdate=true;dotGeo.attributes.position.needsUpdate=true;
    streaks.visible=speed>100;dots.visible=speed<=400;
    // flash at warp start
    $('flash').style.opacity=t>35.3&&t<36.3?(1-Math.abs(t-35.8)*2)*.8:0;
    ship.rotation.set(0,0,Math.sin(clock*1.3)*.06);
    // galaxy approaches during bridge
    galaxy.visible=t>=50;galaxy.position.set(-60,-40,-900+500*ease(seg01(t,50,63.5)));galaxy.rotation.y=clock*.05;
    earth.visible=t>=52.5&&t<66;eM.rotation.y=clock*.3;
    heart.visible=t>=60;const hk=ease(seg01(t,60,86));heart.position.set(0,-10,-1100+1080*hk);
    heart.scale.setScalar(1+Math.sin(clock*3)*.03);
    // camera
    const shake=reduce?0:(t>36&&t<50?(Math.random()-.5)*.25:0);
    let from=V(shake,5+shake,24), to=V(0,1,-25);
    if(t<34.5){const k=ease(seg01(t,31,32.5))*(1-ease(seg01(t,33.5,34.5)));from=V(0,5,24).lerp(V(14,4,-24),k);to=V(0,1,-25).lerp(V(0,.8,-3),k);}
    if(t>=55&&t<62){const k=ease(seg01(t,55,57))*(1-ease(seg01(t,60,62)));from=from.lerp(V(9,3,2),k);to=to.lerp(earth.position,k);}
    if(t>=84){from=V(0,5,24).lerp(V(0,2,4),seg01(t,84,88));}
    look(from,to);
  }
  $('end').style.opacity=t>=84?1:0;
  renderer.render(scene,camera);
  requestAnimationFrame(frame);
}
caption(T);requestAnimationFrame(frame);
</script>
</body>
