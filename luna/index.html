<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>断腕の継承者ルナ — 3D</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@500;700;800&family=Cormorant+Garamond:ital,wght@0,500;1,500&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#e9e6f5; --dim:rgba(233,230,245,.62); --cyan:#8fe9ff; --glass:rgba(18,16,34,.42); --line:rgba(170,200,255,.22);
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  html,body{height:100%;background:#05060c;overflow:hidden;color:var(--ink);font-family:"Shippori Mincho",serif}
  #stage{position:fixed;inset:0}
  #stage canvas{display:block;width:100%;height:100%;touch-action:none}
  .ui{transition:opacity .6s ease}
  .ui.hidden{opacity:0;pointer-events:none}
  #title{
    position:fixed;left:calc(18px + env(safe-area-inset-left));top:calc(16px + env(safe-area-inset-top));
    pointer-events:none;opacity:0;transform:translateY(8px);transition:opacity 2.2s ease,transform 2.2s ease;
  }
  #title.show{opacity:1;transform:none}
  #title .en{font-family:"Cormorant Garamond",serif;font-style:italic;letter-spacing:.32em;font-size:11px;color:var(--dim)}
  #title .jp{font-weight:800;font-size:clamp(22px,5.4vw,34px);letter-spacing:.14em;margin-top:4px;
    text-shadow:0 0 18px rgba(140,200,255,.45),0 0 2px rgba(255,255,255,.4)}
  #title .jp small{font-size:.62em;letter-spacing:.2em;font-weight:700;opacity:.85;margin-right:.25em}
  #title .bar{height:1px;width:120px;margin-top:8px;background:linear-gradient(90deg,var(--cyan),transparent)}
  #mode{font-family:"Cormorant Garamond",serif;letter-spacing:.3em;font-size:11px;color:var(--cyan);margin-top:8px;opacity:.9}
  #line{
    position:fixed;left:0;right:0;bottom:calc(92px + env(safe-area-inset-bottom));text-align:center;pointer-events:none;
    font-size:clamp(14px,3.8vw,18px);letter-spacing:.14em;line-height:1.7;padding:0 22px;
    text-shadow:0 0 12px rgba(0,0,0,.9),0 0 22px rgba(110,170,255,.35);
    opacity:0;transition:opacity 1.2s ease;
  }
  #line.show{opacity:.95}
  #bar{
    position:fixed;left:50%;transform:translateX(-50%);bottom:calc(18px + env(safe-area-inset-bottom));
    display:flex;gap:8px;padding:8px;border-radius:999px;background:var(--glass);border:1px solid var(--line);
    backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);max-width:calc(100vw - 16px)
  }
  #bar button,#tools button{
    font-family:"Shippori Mincho",serif;font-weight:700;color:var(--ink);background:rgba(255,255,255,.04);
    border:1px solid rgba(190,215,255,.18);border-radius:999px;height:44px;min-width:56px;padding:0 14px;font-size:15px;
    letter-spacing:.12em;cursor:pointer;white-space:nowrap;flex:0 0 auto;transition:background .25s,border-color .25s,box-shadow .25s,opacity .25s
  }
  #bar button:active{transform:scale(.96)}
  #bar button.on{border-color:rgba(143,233,255,.75);box-shadow:0 0 14px rgba(120,220,255,.35) inset,0 0 14px rgba(120,220,255,.25);background:rgba(120,220,255,.12)}
  #bar button.atk{background:linear-gradient(180deg,rgba(150,225,255,.22),rgba(120,140,255,.10));border-color:rgba(160,220,255,.5)}
  #bar button:disabled{opacity:.45}
  @media (max-width:520px){ #title .en{max-width:150px;line-height:1.6;letter-spacing:.24em} }
  @media (max-width:400px){ #bar{gap:5px;padding:6px} #bar button{padding:0 11px;min-width:50px;font-size:14px} }
  #tools{position:fixed;right:calc(12px + env(safe-area-inset-right));top:calc(12px + env(safe-area-inset-top));display:flex;gap:6px}
  #tools button{height:34px;min-width:0;padding:0 11px;font-size:12px;background:var(--glass);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
  #tools button.on{border-color:rgba(143,233,255,.7);color:var(--cyan)}
  #hint{position:fixed;left:0;right:0;top:calc(50% - 10px);text-align:center;font-size:12px;letter-spacing:.3em;color:var(--dim);pointer-events:none;opacity:0;transition:opacity .6s}
  #hint.show{opacity:1}
  #loading{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;font-family:"Cormorant Garamond",serif;letter-spacing:.5em;color:var(--dim);font-size:12px;background:#05060c;transition:opacity 1.2s;z-index:5}
  #loading.gone{opacity:0;pointer-events:none}
  #err{position:fixed;left:12px;right:12px;bottom:12px;color:#ffb3c0;font:12px monospace;white-space:pre-wrap;z-index:9}
</style>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { RoundedBoxGeometry } from 'three/addons/geometries/RoundedBoxGeometry.js';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { ShaderPass } from 'three/addons/postprocessing/ShaderPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';

window.addEventListener('error', e => { document.getElementById('err').textContent = String(e.message || e); });

/* =========================================================
   台詞（ここを書き換えると字幕が変わります）
   ========================================================= */
const LINES = {
  normal: '失くした右腕のかわりに、この腕は何を掴むんだろう。',
  punch:  '――届け。',
  shield: '守れなかったぶんまで、今度は守る。',
  bash:   '退いて。ここから先は、通さない。',
  sword:  '断ち切るのは、迷いだけでいい。',
  slash:  '――断つ。',
  release:'……おやすみ。また、力を貸して。'
};

/* ---------------- utils ---------------- */
const V3 = THREE.Vector3;
const clamp = (x, a, b) => Math.min(b, Math.max(a, x));
const lerp = (a, b, t) => a + (b - a) * t;
const sstep = (a, b, x) => { const t = clamp((x - a) / (b - a), 0, 1); return t * t * (3 - 2 * t); };
const EASE = {
  lin: t => t,
  io: t => t < .5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2,
  out: t => 1 - Math.pow(1 - t, 3),
  in: t => t * t * t,
  out5: t => 1 - Math.pow(1 - t, 5),
  back: t => { const c1 = 1.70158, c3 = c1 + 1; return 1 + c3 * Math.pow(t - 1, 3) + c1 * Math.pow(t - 1, 2); },
  sine: t => -(Math.cos(Math.PI * t) - 1) / 2
};
let _seed = 20261109;
const rnd = () => { _seed = (_seed * 16807) % 2147483647; return (_seed - 1) / 2147483646; };
const rr = (a, b) => a + (b - a) * rnd();
const PI = Math.PI, TAU = PI * 2;
function cvs(w, h) { const c = document.createElement('canvas'); c.width = w; c.height = h; return c; }
function ctex(c, srgb = true) { const t = new THREE.CanvasTexture(c); if (srgb) t.colorSpace = THREE.SRGBColorSpace; t.anisotropy = 8; return t; }

/* ---------------- renderer / scene ---------------- */
const isPortrait = () => innerWidth / innerHeight < 0.8;
const renderer = new THREE.WebGLRenderer({ antialias: false, powerPreference: 'high-performance' });
const DPR = Math.min(window.devicePixelRatio || 1, 1.75);
renderer.setPixelRatio(DPR);
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.15;
document.getElementById('stage').appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x05060c);
scene.fog = new THREE.FogExp2(0x241f3a, 0.03);

const camera = new THREE.PerspectiveCamera(34, innerWidth / innerHeight, 0.05, 400);
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true; controls.dampingFactor = 0.07;
controls.minDistance = 0.9; controls.maxDistance = 10;
controls.maxPolarAngle = 1.66; controls.autoRotate = true; controls.autoRotateSpeed = 0.35;
controls.target.set(0, 1.0, 0);
controls.enabled = false;

/* ---------------- toon materials ---------------- */
const GRAD = (() => {
  const d = new Uint8Array([58, 120, 190, 255]);
  const t = new THREE.DataTexture(d, 4, 1, THREE.RedFormat);
  t.minFilter = t.magFilter = THREE.NearestFilter; t.needsUpdate = true; return t;
})();
const RIM = { rimColor: { value: new THREE.Color(0x9cc0ff) }, rimPow: { value: 3.2 }, rimStr: { value: 0.55 } };
function toon(color, o = {}) {
  const rim = o.rim !== false; delete o.rim;
  const m = new THREE.MeshToonMaterial({ color, gradientMap: GRAD, ...o });
  if (rim) m.onBeforeCompile = s => {
    s.uniforms.rimColor = RIM.rimColor; s.uniforms.rimPow = RIM.rimPow; s.uniforms.rimStr = RIM.rimStr;
    s.fragmentShader = 'uniform vec3 rimColor; uniform float rimPow; uniform float rimStr;\n' +
      s.fragmentShader.replace('#include <opaque_fragment>', `
        float rimF = 1.0 - max(dot(normalize(normal), normalize(vViewPosition)), 0.0);
        outgoingLight += rimColor * pow(rimF, rimPow) * rimStr * (0.35 + 0.65 * diffuseColor.rgb);
        #include <opaque_fragment>`);
  };
  return m;
}
const OUTLINE = new THREE.ShaderMaterial({
  uniforms: { thick: { value: 0.0024 }, color: { value: new THREE.Color(0x15111c) } },
  vertexShader: `uniform float thick;
    void main(){ vec4 mv = modelViewMatrix * vec4(position,1.0);
      vec3 n = normalize(normalMatrix * normal);
      mv.xyz += n * thick * clamp(-mv.z, 0.6, 6.0);
      gl_Position = projectionMatrix * mv; }`,
  fragmentShader: `uniform vec3 color; void main(){ gl_FragColor = vec4(color,1.0); }`,
  side: THREE.BackSide
});

/* ---------------- procedural textures ---------------- */
function armorTexture(tint = '#ece7e1', rust = 1) {
  const S = 512, c = cvs(S, S), g = c.getContext('2d');
  g.fillStyle = tint; g.fillRect(0, 0, S, S);
  const id = g.getImageData(0, 0, S, S);
  for (let i = 0; i < id.data.length; i += 4) { const n = (rnd() - .5) * 12; id.data[i] += n; id.data[i + 1] += n; id.data[i + 2] += n; }
  g.putImageData(id, 0, 0);
  for (let i = 0; i < 40 * rust; i++) {
    const x = rnd() * S, y = rnd() * S, r = rr(12, 60);
    const gr = g.createRadialGradient(x, y, 0, x, y, r);
    gr.addColorStop(0, `rgba(96,86,84,${rr(.03, .1)})`); gr.addColorStop(1, 'rgba(96,86,84,0)');
    g.fillStyle = gr; g.fillRect(x - r, y - r, r * 2, r * 2);
  }
  for (let i = 0; i < 70 * rust; i++) {
    const edge = rnd() < .8; let x = rnd() * S, y = rnd() * S;
    if (edge) { if (rnd() < .5) x = rnd() < .5 ? rr(0, 40) : rr(S - 40, S); else y = rnd() < .5 ? rr(0, 40) : rr(S - 40, S); }
    g.fillStyle = `rgba(${rr(110, 140) | 0},${rr(60, 80) | 0},${rr(40, 55) | 0},${rr(.18, .45)})`;
    g.beginPath(); g.arc(x, y, rr(1, 3.5), 0, TAU); g.fill();
  }
  g.lineCap = 'round';
  for (let i = 0; i < 46; i++) {
    g.strokeStyle = `rgba(90,88,92,${rr(.1, .25)})`; g.lineWidth = rr(.5, 1.2);
    const x = rnd() * S, y = rnd() * S, a = rr(0, TAU), l = rr(10, 70);
    g.beginPath(); g.moveTo(x, y); g.lineTo(x + Math.cos(a) * l, y + Math.sin(a) * l); g.stroke();
  }
  const e = g.createLinearGradient(0, 0, S, 0);
  e.addColorStop(0, 'rgba(60,50,48,.28)'); e.addColorStop(.08, 'rgba(60,50,48,0)'); e.addColorStop(.92, 'rgba(60,50,48,0)'); e.addColorStop(1, 'rgba(60,50,48,.28)');
  g.fillStyle = e; g.fillRect(0, 0, S, S);
  const e2 = g.createLinearGradient(0, 0, 0, S);
  e2.addColorStop(0, 'rgba(60,50,48,.22)'); e2.addColorStop(.08, 'rgba(60,50,48,0)'); e2.addColorStop(.92, 'rgba(60,50,48,0)'); e2.addColorStop(1, 'rgba(60,50,48,.3)');
  g.fillStyle = e2; g.fillRect(0, 0, S, S);
  return ctex(c);
}
function hairStrandTexture() {
  const c = cvs(64, 256), g = c.getContext('2d');
  const gr = g.createLinearGradient(0, 256, 0, 0); // bottom = root
  gr.addColorStop(0, '#5b4134'); gr.addColorStop(.08, '#7a5c4b'); gr.addColorStop(.14, '#d9c1aa');
  gr.addColorStop(.2, '#8d6f5c'); gr.addColorStop(.65, '#a2826c'); gr.addColorStop(1, '#c6a78f');
  g.fillStyle = gr; g.fillRect(0, 0, 64, 256);
  for (let i = 0; i < 26; i++) {
    g.strokeStyle = rnd() < .5 ? 'rgba(60,40,30,.07)' : 'rgba(255,235,215,.06)';
    g.lineWidth = rr(1, 2.5); const x = rnd() * 64; g.beginPath(); g.moveTo(x, 0); g.lineTo(x + rr(-3, 3), 256); g.stroke();
  }
  return ctex(c);
}
function hairCapTexture(band) {
  const c = cvs(256, 256), g = c.getContext('2d');
  const gr = g.createLinearGradient(0, 0, 0, 256);
  gr.addColorStop(0, '#7c5f4e'); gr.addColorStop(1, '#8c6d59');
  g.fillStyle = gr; g.fillRect(0, 0, 256, 256);
  if (band) {
    const b = g.createLinearGradient(0, 120, 0, 190);
    b.addColorStop(0, 'rgba(232,210,188,0)'); b.addColorStop(.5, 'rgba(232,210,188,.85)'); b.addColorStop(1, 'rgba(232,210,188,0)');
    g.fillStyle = b; g.fillRect(0, 120, 256, 70);
  }
  for (let i = 0; i < 90; i++) {
    g.strokeStyle = rnd() < .55 ? 'rgba(50,34,26,.08)' : 'rgba(255,235,215,.05)';
    g.lineWidth = rr(1, 3); const x = rnd() * 256; g.beginPath(); g.moveTo(x, 0); g.lineTo(x + rr(-4, 4), 256); g.stroke();
  }
  return ctex(c);
}

/* face: drawn in sphere-angle space (phi 1.7rad wide x theta 1.0rad tall) */
const FACE = { phiLen: 1.7, thStart: 1.05, thLen: 1.0, K: 600 };
function faceTexture(expr) {
  const K = FACE.K, W = Math.round(FACE.phiLen * K), H = Math.round(FACE.thLen * K);
  const c = cvs(W, H), g = c.getContext('2d');
  const Y = th => (th - FACE.thStart) * K, cx0 = W / 2;
  const eyeY = Y(1.69), browY = Y(1.4), mouthY = Y(1.985), noseY = Y(1.84);
  g.lineCap = 'round'; g.lineJoin = 'round';
  // blush
  [-1, 1].forEach(s => {
    const x = cx0 + s * 0.4 * K, y = eyeY + 0.19 * K;
    const gr = g.createRadialGradient(x, y, 0, x, y, 0.12 * K);
    gr.addColorStop(0, `rgba(255,120,140,${expr === 'fierce' ? .16 : .3})`); gr.addColorStop(1, 'rgba(255,120,140,0)');
    g.fillStyle = gr; g.beginPath(); g.ellipse(x, y, 0.13 * K, 0.075 * K, 0, 0, TAU); g.fill();
    if (expr !== 'fierce') { // blush hatching
      g.strokeStyle = 'rgba(230,110,120,.35)'; g.lineWidth = 2.2;
      for (let k = -1; k <= 1; k++) { g.beginPath(); g.moveTo(x + k * 12 + 5, y - 6); g.lineTo(x + k * 12 - 3, y + 6); g.stroke(); }
    }
  });
  // nose
  g.strokeStyle = 'rgba(175,110,100,.55)'; g.lineWidth = 4;
  g.beginPath(); g.moveTo(cx0 + 5, noseY - 10); g.lineTo(cx0 - 1, noseY + 3); g.stroke();
  // mouth
  g.strokeStyle = '#9b5a5c'; g.lineWidth = 0.0085 * K;
  g.beginPath();
  if (expr === 'fierce') { g.moveTo(cx0 - 0.03 * K, mouthY); g.quadraticCurveTo(cx0, mouthY + 0.004 * K, cx0 + 0.03 * K, mouthY); }
  else { g.moveTo(cx0 - 0.034 * K, mouthY + 0.004 * K); g.quadraticCurveTo(cx0, mouthY - 0.008 * K, cx0 + 0.034 * K, mouthY + 0.004 * K); }
  g.stroke();
  // eyes
  [-1, 1].forEach(s => drawEye(g, cx0 + s * 0.355 * K, eyeY, s, expr, K));
  // brows
  g.strokeStyle = '#5b3f33'; g.lineWidth = 0.013 * K;
  [-1, 1].forEach(s => {
    const xi = cx0 + s * 0.19 * K, xo = cx0 + s * 0.52 * K;
    let yi = browY - 0.025 * K, yo = browY + 0.015 * K, ym = browY - 0.03 * K;
    if (expr === 'fierce') { yi = browY + 0.035 * K; yo = browY - 0.02 * K; ym = browY - 0.005 * K; }
    g.beginPath(); g.moveTo(xi, yi); g.quadraticCurveTo((xi + xo) / 2, ym, xo, yo); g.stroke();
  });
  return ctex(c);
}
function drawEye(g, cx, cy, s, expr, K) {
  const w = 0.31 * K, h = 0.275 * K;
  g.lineCap = 'round'; g.lineJoin = 'round';
  if (expr === 'closed') {
    g.strokeStyle = '#26171d'; g.lineWidth = 0.022 * K;
    g.beginPath(); g.moveTo(cx - s * w * 0.5, cy + h * 0.06);
    g.quadraticCurveTo(cx, cy + h * 0.3, cx + s * w * 0.52, cy); g.lineTo(cx + s * w * 0.64, cy - h * 0.1); g.stroke();
    g.lineWidth = 0.006 * K; g.strokeStyle = 'rgba(90,50,60,.5)';
    g.beginPath(); g.moveTo(cx - s * w * 0.2, cy - h * 0.05); g.quadraticCurveTo(cx + s * w * 0.1, cy - h * 0.12, cx + s * w * 0.4, cy - h * 0.06); g.stroke();
    return;
  }
  const fierce = expr === 'fierce';
  const lid = fierce ? 0.7 : 0.86;
  const top = cy - h * 0.5 + h * (1 - lid) * 0.95, bot = cy + h * 0.5;
  const inner = [cx - s * w * 0.5, cy + h * 0.1], outer = [cx + s * w * 0.53, cy - h * (fierce ? 0.16 : 0.07)];
  const upper = () => { g.moveTo(...inner); g.bezierCurveTo(cx - s * w * 0.36, top + (fierce ? h * 0.12 : 0), cx + s * w * 0.25, top - h * 0.02, ...outer); };
  g.save();
  g.beginPath(); upper();
  g.bezierCurveTo(cx + s * w * 0.46, bot - h * 0.12, cx + s * w * 0.12, bot + h * 0.02, cx - s * w * 0.14, bot - h * 0.05);
  g.quadraticCurveTo(cx - s * w * 0.42, bot - h * 0.18, ...inner); g.closePath();
  g.fillStyle = '#fbf6f8'; g.fill(); g.clip();
  const ix = cx + s * w * 0.03, iy = cy + h * 0.1, irx = w * 0.35, iry = h * 0.52;
  let gr = g.createLinearGradient(0, iy - iry, 0, iy + iry);
  gr.addColorStop(0, '#20122c'); gr.addColorStop(.42, '#553a82'); gr.addColorStop(.82, '#ad8ede'); gr.addColorStop(1, '#dccbf6');
  g.fillStyle = gr; g.beginPath(); g.ellipse(ix, iy, irx, iry, 0, 0, TAU); g.fill();
  g.strokeStyle = 'rgba(28,14,38,.9)'; g.lineWidth = 0.011 * K; g.stroke();
  g.fillStyle = 'rgba(20,9,30,.95)'; g.beginPath(); g.ellipse(ix, iy - iry * 0.04, irx * 0.4, iry * 0.46, 0, 0, TAU); g.fill();
  g.strokeStyle = 'rgba(225,205,255,.45)'; g.lineWidth = 0.005 * K;
  g.beginPath(); g.ellipse(ix, iy + iry * 0.08, irx * 0.72, iry * 0.7, 0, 0.15 * PI, 0.85 * PI); g.stroke();
  gr = g.createLinearGradient(0, top - h * 0.05, 0, top + h * 0.42);
  gr.addColorStop(0, 'rgba(60,32,72,.6)'); gr.addColorStop(1, 'rgba(60,32,72,0)');
  g.fillStyle = gr; g.fillRect(cx - w, top - h * 0.3, w * 2, h * 0.8);
  g.fillStyle = 'rgba(255,255,255,.96)';
  g.beginPath(); g.ellipse(ix - irx * 0.36, iy - iry * 0.4, irx * 0.25, iry * 0.19, -0.3, 0, TAU); g.fill();
  g.beginPath(); g.ellipse(ix + irx * 0.38, iy + iry * 0.36, irx * 0.1, iry * 0.075, 0, 0, TAU); g.fill();

const POSE_JOINTS = ['hips', 'spine', 'chest', 'neck', 'head', 'lSh', 'lEl', 'lWr', 'rSh', 'rEl', 'rWr'];
function lerpPose(a, b, t, out = {}) { for (const k in b) { const A = a[k] || b[k], B = b[k]; const o = out[k] || (out[k] = []); for (let i = 0; i < B.length; i++) o[i] = A[i] + (B[i] - A[i]) * t; } return out; }
const clonePose = p => { const r = {}; for (const k in p) r[k] = p[k].slice(); return r; };

let mode = 'normal';
let cur = clonePose(P.normalIdle);
let anim = null;
let idleBlend = clonePose(P.normalIdle);
function play(keys, events = [], opts = {}) {

}
function samplePose(dt) {
  if (!anim) { const target = P[mode + 'Idle']; lerpPose(cur, target, 1 - Math.pow(0.02, dt), cur); return cur; }
  anim.t += dt;
  for (const e of anim.events) if (!e.done && anim.t >= e.t) { e.done = true; e.fn(); }
  const ks = anim.keys; let prevT = 0, prevP = anim.from, i = 0;
  while (i < ks.length && anim.t > ks[i].t) { prevT = ks[i].t; prevP = ks[i].p; i++; }
  if (i >= ks.length) { lerpPose(cur, ks[ks.length - 1].p, 1, cur); const done = anim.onEnd; anim = null; done && done(); return cur; }
  const k = ks[i], u = (anim.t - prevT) / Math.max(k.t - prevT, 1e-4);
  lerpPose(prevP, k.p, (EASE[k.e || 'io'])(clamp(u, 0, 1)), cur);
  return cur;
}

/* ---------- IK legs ---------- */
const _qa = new THREE.Quaternion(), _qb = new THREE.Quaternion(), _qc = new THREE.Quaternion(), _mb = new THREE.Matrix4();
const _X = new V3(), _Y = new V3(), _Z = new V3();
function basisQuat(y, zHint, out) { _Y.copy(y).normalize(); _Z.copy(zHint).addScaledVector(_Y, -zHint.dot(_Y)).normalize(); _X.crossVectors(_Y, _Z); _mb.makeBasis(_X, _Y, _Z); return out.setFromRotationMatrix(_mb); }
function solveLeg(hip, knee, ank, foot, yaw) {
  const hipW = hip.getWorldPosition(new V3());
  const target = new V3(foot[0], LEG.ANK + foot[1] + groundH(foot[0], foot[2]), foot[2]);
  const toT = target.clone().sub(hipW); let d = clamp(toT.length(), 0.08, LEG.L1 + LEG.L2 - 0.002); const dir = toT.normalize();
  const pole = new V3(Math.sin(yaw), 0, Math.cos(yaw)).add(new V3(0, 0, 1).applyQuaternion(rig.hips.getWorldQuaternion(_qa)).multiplyScalar(0.6)).normalize();
  const cosA = (LEG.L1 * LEG.L1 + d * d - LEG.L2 * LEG.L2) / (2 * LEG.L1 * d);
  const A = Math.acos(clamp(cosA, -1, 1));
  const n = new V3().crossVectors(dir, pole); if (n.lengthSq() < 1e-8) n.set(1, 0, 0); n.normalize();
  const thighDir = dir.clone().applyAxisAngle(n, A);
  const kneeP = hipW.clone().addScaledVector(thighDir, LEG.L1);
  const shinDir = target.clone().sub(kneeP).normalize();
  const qT = basisQuat(thighDir.clone().negate(), pole, new THREE.Quaternion());
  const qS = basisQuat(shinDir.clone().negate(), pole, new THREE.Quaternion());
  const qF = basisQuat(new V3(0, 1, 0), new V3(Math.sin(yaw), 0, Math.cos(yaw)), new THREE.Quaternion());
  rig.hips.getWorldQuaternion(_qa);
  hip.quaternion.copy(_qa.invert().multiply(qT));
  knee.quaternion.copy(qT.clone().invert().multiply(qS));
  ank.quaternion.copy(qS.clone().invert().multiply(qF));
}

let T = 0;
function applyPose(p, t) {
  const br = Math.sin(t * 1.6), sw = Math.sin(t * 0.33);
  const add = {
    chest: R(0.018 * br, 0.02 * sw, 0), spine: R(0.01 * br, 0, 0), head: R(0.02 * Math.sin(t * 0.27), 0.05 * Math.sin(t * 0.31), 0.02 * Math.sin(t * 0.2)),
    lSh: R(0, 0, 0.02 * Math.sin(t * 1.6 + 1)), rSh: R(0.015 * Math.sin(t * 1.6 + 2), 0, 0)
  };
  for (const j of POSE_JOINTS) { const r = p[j], a = add[j] || [0, 0, 0]; rig[j].rotation.set(r[0] + a[0], r[1] + a[1], r[2] + a[2]); }
  rig.hips.position.set(p.hipsPos[0], HIP_H + p.hipsPos[1] + 0.004 * br, p.hipsPos[2]);
  charRoot.updateMatrixWorld(true);
  solveLeg(rig.lHip, rig.lKnee, rig.lAnk, p.lFoot, p.fy[0]);
  solveLeg(rig.rHip, rig.rKnee, rig.rAnk, p.rFoot, p.fy[1]);
  // left fingers
  const lc = p.lcurl[0];
  lFingers.forEach((segs, i) => segs.forEach((s, k) => { s.rotation.set(0, 0, -lc * [0.7, 1.0, 0.8][k] * (1 + i * 0.08)); }));
  lFingers.thumb.rotation.set(0.5 + lc * 0.3, 0, -0.3);
  // right claws: curl vs. fold-back (sword guard)
  const c = p.curl[0], sw2 = clamp(p.sword[0] * 1.6, 0, 1), sh = p.shield[0];
  arm.fingers.forEach(f => {
    const spread = (f.i - 1.5) * 0.18;
    f.base.rotation.set(spread * (0.4 + 0.6 * (1 - c)) + sw2 * (f.i - 1.5) * 0.55, 0, lerp(c * 0.55, -1.5, sw2));
    f.segs.forEach((s, k) => { if (k === 0) return; s.rotation.set(0, 0, lerp(c * [0, 1.35, 1.25][k], [0, -0.55, -0.35][k], sw2)); });
  });
  arm.thumb[0].rotation.set(lerp(-0.3 - c * 0.6, 0.9, sw2), 0, lerp(0.4 + c * 0.6, -0.6, sw2));
  arm.thumb[1].rotation.set(0, 0, lerp(c * 0.9, -0.3, sw2));
  applyShield(sh, t); applySword(p.sword[0], t);
  // glow
  const g = p.glow[0] * (1 + 0.08 * Math.sin(t * 7.0) + 0.04 * Math.sin(t * 23.0));
  GLOW.color.setRGB(0.18 * g + 0.05, 0.75 * g + 0.15, 1.15 * g + 0.25);
  GLOW_BLADE.color.setRGB(0.7 * g + 0.4, 1.4 * g + 0.6, 1.9 * g + 0.8);
  rig.rEl.localToWorld(armLight.position.set(-0.32, -0.18, 0.12));
  armLight.intensity = 0.03 * p.glow[0] + p.thrust[0] * 0.12 + flash * 0.4;
  arm.flames.forEach((f, i) => { const th = p.thrust[0] * (0.8 + 0.4 * Math.random()); f.material.opacity = clamp(th, 0, 1) * (i % 2 ? 0.9 : 0.7); f.scale.set(1, 0.3 + th * (i % 2 ? 1.1 : 1.6), 1); f.visible = th > 0.02; });
  windBoost = p.wind[0];
  charRoot.updateMatrixWorld(true);
}
let windBoost = 1;
function applyShield(s, t) {
  const G = shield.group;
  G.visible = s > 0.001;
  if (!G.visible) return;
  const slide = EASE.out(sstep(0, 0.35, s));
  G.position.set(0, lerp(-0.17, -0.18, slide), lerp(-0.07, -0.12, slide));
  const sc = lerp(0.42, 1, EASE.back(sstep(0.05, 0.4, s)));
  G.scale.setScalar(sc);
  shield.petals.forEach(pt => {
    const st = sstep(0.25 + pt.k * 0.07, 0.6 + pt.k * 0.07, s);
    pt.hinge.rotation.x = lerp(-PI * (0.93 - pt.k * 0.01), 0, EASE.back(st));
    pt.hinge.position.z = lerp(-0.02 - pt.k * 0.006, 0, st);
    pt.hinge.position.y = lerp(-0.02, 0, st);
  });
  const m = sstep(0.8, 1.0, s);
  shield.mem.visible = m > 0.001;
  shield.memMat.uniforms.uOp.value = m * (0.75 + 0.25 * Math.sin(t * 3.0));
  shield.memMat.uniforms.uT.value = t;
  shield.inner.rotation.z = (1 - EASE.out(sstep(0.1, 0.7, s))) * -1.2;
}
function applySword(s, t) {
  sword.group.visible = s > 0.002;
  if (!sword.group.visible) return;
  sword.segs.forEach(sg => {
    const st = EASE.out(sstep(0.1 + sg.i * 0.15, 0.45 + sg.i * 0.15, s));
    sg.holder.position.y = lerp(-0.12, sg.y0, st);
    sg.holder.scale.set(lerp(0.6, 1, st), lerp(0.08, 1, st), lerp(0.6, 1, st));
    sg.holder.visible = st > 0.01;
  });
  sword.ring.scale.setScalar(lerp(0.2, 1, EASE.back(sstep(0.0, 0.3, s))));
}

    ], [
      { t: o + 0.25, fn: () => { converge(new V3(0, -0.18, -0.05), rig.rEl, 110); scanOn = 1; } },
      { t: o + 1.6, fn: () => { burst(shield.group, new V3(0, 0, -0.05), 80); shockwave(shield.group.localToWorld(new V3()), forwardOf(rig.hips), 1.1, 0.5); setMode('shield'); setExpr('calm'); } }
    ]);
  },
  toSword() {
    if (busy() || mode === 'sword') return;
    setExpr('fierce', 1.4); say(LINES.sword, 4.5);
    const pre = mode === 'shield' ? [{ t: 0.55, p: pose({ shield: [0], sword: [0], curl: [0.5] }, P.swordRaise), e: 'io' }] : [];
    const o = pre.length ? 0.55 : 0;
    play([
      ...pre,
      { t: o + 0.5, p: pose({ sword: [0.01], curl: [0.2] }, P.swordRaise), e: 'io' },
      { t: o + 1.7, p: pose({ sword: [1], glow: [2.4] }, P.swordRaise), e: 'sine' },
      { t: o + 2.4, p: P.swordIdle, e: 'io' }
    ], [
      { t: o + 0.25, fn: () => { converge(new V3(0, -0.4, 0), rig.rWr, 110); scanOn = 1; } },
      { t: o + 1.65, fn: () => { burst(rig.rWr, sword.tipLocal, 70); burst(rig.rWr, new V3(0, -0.15, 0), 40); setMode('sword'); setExpr('calm'); } }
    ]);
  },
  release() {
    if (busy() || mode === 'normal') return;
    say(LINES.release, 4.5); setExpr('closed', 0.9);
    const raise = mode === 'shield' ? P.shieldRaise : P.swordRaise;
    play([
      { t: 0.5, p: pose({ shield: [mode === 'shield' ? 1 : 0], sword: [mode === 'sword' ? 1 : 0], glow: [0.8] }, raise), e: 'io' },
      { t: 1.6, p: pose({ shield: [0], sword: [0], glow: [0.4], curl: [0.5] }, raise), e: 'sine' },
      { t: 2.4, p: P.normalIdle, e: 'io' }
    ], [
      { t: 0.6, fn: () => { scanOn = 1; } },
      { t: 1.6, fn: () => { setMode('normal'); burst(rig.rEl, new V3(0, -0.2, 0), 30, [0.4, 1.0, 2.0]); } }
    ]);
  }
};
// scan ring (transformation sweep)
const scanRing = new THREE.Mesh(new THREE.TorusGeometry(0.11, 0.006, 8, 48), new THREE.MeshBasicMaterial({ color: new THREE.Color(1, 3, 4), transparent: true, blending: THREE.AdditiveBlending, depthWrite: false }));
scanRing.rotation.x = PI / 2; rig.rEl.add(scanRing); scanRing.visible = false;
let scanOn = 0, scanT = 0;

/* ---------- demo ---------- */
let demo = false, demoQ = [], demoWait = 0;
const DEMO_SEQ = ['punch', 'wait', 'toShield', 'wait', 'attack', 'wait', 'toSword', 'wait', 'attack', 'wait', 'attack', 'wait', 'release', 'wait', 'wait'];
function demoStep(dt) {
  if (!demo || busy()) return;
  demoWait -= dt; if (demoWait > 0) return;
  if (!demoQ.length) demoQ = DEMO_SEQ.slice();
  const s = demoQ.shift();
  if (s === 'wait') { demoWait = 1.2; return; }
  A[s]();
}

/* ---------- UI wiring ---------- */
const stopDemo = () => { demo = false; ui.demo.classList.remove('on'); };
ui.atk.onclick = () => { stopDemo(); A.attack(); };
ui.shield.onclick = () => { stopDemo(); A.toShield(); };
ui.sword.onclick = () => { stopDemo(); A.toSword(); };
ui.rel.onclick = () => { stopDemo(); A.release(); };
ui.demo.onclick = () => { demo = !demo; ui.demo.classList.toggle('on', demo); demoQ = []; demoWait = 0; };
const bCam = document.getElementById('bCam'), bHide = document.getElementById('bHide'), hint = document.getElementById('hint');
bCam.onclick = () => { controls.autoRotate = !controls.autoRotate; bCam.classList.toggle('on', controls.autoRotate); };
let uiHidden = false;
bHide.onclick = e => { e.stopPropagation(); uiHidden = true; document.querySelectorAll('.ui').forEach(el => el.classList.add('hidden')); hint.classList.add('show'); setTimeout(() => hint.classList.remove('show'), 1600); };
let downAt = 0, downXY = [0, 0];
renderer.domElement.addEventListener('pointerdown', e => { downAt = performance.now(); downXY = [e.clientX, e.clientY]; });
renderer.domElement.addEventListener('pointerup', e => {
  if (!uiHidden) return;
  if (performance.now() - downAt < 300 && Math.hypot(e.clientX - downXY[0], e.clientY - downXY[1]) < 8) { uiHidden = false; document.querySelectorAll('.ui').forEach(el => el.classList.remove('hidden')); }
});
window.addEventListener('keydown', e => {
  const k = e.key.toLowerCase();
  if (k === 'z' || k === ' ') A.attack(); else if (k === 'x') A.toShield(); else if (k === 'c') A.toSword(); else if (k === 'v') A.release();
});

/* =========================================================
   POST
   ========================================================= */
const rt = new THREE.WebGLRenderTarget(innerWidth * DPR, innerHeight * DPR, { type: THREE.HalfFloatType, samples: 4 });
const composer = new EffectComposer(renderer, rt);
composer.setPixelRatio(DPR); composer.setSize(innerWidth, innerHeight);
composer.addPass(new RenderPass(scene, camera));
const bloom = new UnrealBloomPass(new THREE.Vector2(innerWidth / 2, innerHeight / 2), 0.8, 0.55, 1.05);
composer.addPass(bloom);
const grade = new ShaderPass({
  uniforms: { tDiffuse: { value: null }, uT: { value: 0 }, uFlash: { value: 0 }, uRes: { value: new THREE.Vector2(innerWidth, innerHeight) } },
  vertexShader: `varying vec2 vUv; void main(){ vUv=uv; gl_Position = projectionMatrix*modelViewMatrix*vec4(position,1.0); }`,
  fragmentShader: `uniform sampler2D tDiffuse; uniform float uT; uniform float uFlash; uniform vec2 uRes; varying vec2 vUv;
    float h(vec2 p){ return fract(sin(dot(p, vec2(12.9898,78.233)))*43758.5453); }
    void main(){ vec2 c = vUv-0.5; float d = length(c*vec2(uRes.x/uRes.y,1.0));
      vec2 off = c*d*0.008;
      vec3 col; col.r = texture2D(tDiffuse, vUv+off).r; col.g = texture2D(tDiffuse, vUv).g; col.b = texture2D(tDiffuse, vUv-off).b;
      col += vec3(0.010,0.006,0.026);
      col *= mix(1.0, smoothstep(1.05,0.25,d), 0.6);
      col += (h(vUv*uRes + fract(uT)*91.0)-0.5)*0.03;
      col += uFlash*vec3(0.5,0.85,1.0);
      gl_FragColor = vec4(col,1.0); }`
});
composer.addPass(grade);
composer.addPass(new OutputPass());

function resize() {
  const w = innerWidth, h = innerHeight;
  camera.aspect = w / h; camera.updateProjectionMatrix();
  renderer.setSize(w, h); composer.setSize(w, h); bloom.setSize(w / 2, h / 2);
  grade.uniforms.uRes.value.set(w, h);
  motes.uniforms.uS.value = DPR * h / 900;
}
addEventListener('resize', resize);

/* =========================================================
   CAMERA INTRO & LOOP
   ========================================================= */
const camEnd = () => isPortrait() ? new V3(1.55, 1.25, 4.6) : new V3(1.75, 1.22, 3.5);
const intro = { t: 0, dur: 5.2, on: true, from: new V3(0.32, 1.52, 0.72), fromT: new V3(0, 1.5, 0), toT: new V3(0, 0.98, 0) };
function skipIntro() { if (!intro.on) return; intro.on = false; camera.position.copy(camEnd()); controls.target.copy(intro.toT); controls.enabled = true; document.getElementById('title').classList.add('show'); }
renderer.domElement.addEventListener('pointerdown', skipIntro);
camera.position.copy(intro.from); camera.lookAt(intro.fromT);

applyPose(cur, 0); hairInit();
let blinkNext = 2.5, blinkUntil = 0;
const clock = new THREE.Clock();
let hairAcc = 0, shootNext = 5, shooting = null;
const shakeOff = new V3();
let firstFrame = true;

function frame() {
  requestAnimationFrame(frame);
  let rdt = Math.min(clock.getDelta(), 1 / 20);
  if (window.__fixedDt) rdt = window.__fixedDt;
  let dt = rdt;
  if (hitstop > 0) { hitstop -= rdt; dt = rdt * 0.06; }
  T += dt;

  // pose
  const p = window.__freeze ? window.__freeze : samplePose(dt);
  applyPose(p, T);

  // expression & blink
  if (exprUntil && T > exprUntil) { expr = 'calm'; exprUntil = 0; }
  if (T > blinkNext) { blinkUntil = T + 0.12; blinkNext = T + rr(2.4, 5.5); }
  FACE_MAT.map = (T < blinkUntil || expr === 'closed') ? TEX.face.closed : TEX.face[expr];

  // hair
  hairAcc += dt; const step = 1 / 60; let n = 0;
  while (hairAcc >= step && n < 4) { hairStep(step, T); hairAcc -= step; n++; }
  if (n === 4) hairAcc = 0;
  hairBuild();

  // trails
  if (trailMode === 'fist') { const f = fistPos(); const up = new V3(0, 1, 0); fistTrail.push(f.clone().addScaledVector(up, 0.07), f.clone().addScaledVector(up, -0.07)); }
  if (trailMode === 'blade') { bladeTrail.push(rig.rWr.localToWorld(new V3(0, -0.3, 0)), rig.rWr.localToWorld(sword.tipLocal.clone())); }
  fistTrail.update(dt); bladeTrail.update(dt);

  // scan ring
  if (scanOn) { scanT += dt / 1.1; scanRing.visible = true; scanRing.position.y = lerp(0.0, -0.36, (scanT * 2) % 1); scanRing.material.opacity = Math.sin(PI * ((scanT * 2) % 1)); scanRing.scale.setScalar(1 + 0.1 * Math.sin(T * 20)); if (scanT > 1) { scanOn = 0; scanT = 0; scanRing.visible = false; } }

  // shooting stars
  shootNext -= rdt;
  if (shootNext < 0 && !shooting) { const a = rr(-1.2, 1.2); shooting = { p: new V3(Math.sin(a) * 60 + rr(-20, 20), rr(35, 55), -Math.cos(a) * 60), v: new V3(rr(-1, 1), -0.45, rr(-0.3, 0.3)).normalize().multiplyScalar(70), t: 0 }; shootNext = rr(6, 13); }
  if (shooting) { shooting.t += rdt; shooting.p.addScaledVector(shooting.v, rdt); const s = shooting.p, w = new V3(0, 0.12, 0); if (shooting.t < 0.7) starTrail.push(s.clone().add(w), s.clone().sub(w)); if (shooting.t > 1.3) shooting = null; }
  starTrail.update(rdt);

  sparks.update(dt); updateWaves(dt);

  // atmosphere
  skyTint = lerp(skyTint, skyTintTarget, 1 - Math.pow(0.3, rdt));
  skyMat.uniforms.uT.value = T; skyMat.uniforms.uTint.value = skyTint;
  window._stars.uniforms.uT.value = T;
  moteBoost = lerp(moteBoost, (anim ? 1 : 0) + skyTint, 1 - Math.pow(0.2, rdt));
  motes.uniforms.uT.value = T; motes.uniforms.uB.value += rdt * moteBoost;
  flash = Math.max(0, flash - rdt * 2.4); grade.uniforms.uFlash.value = flash * 0.5; grade.uniforms.uT.value = T;

  // camera
  camera.position.sub(shakeOff);
  if (intro.on) {
    intro.t += rdt; const k = EASE.io(clamp(intro.t / intro.dur, 0, 1));
    const e = camEnd();
    camera.position.lerpVectors(intro.from, e, k); camera.position.y += Math.sin(k * PI) * 0.15;
    const tg = new V3().lerpVectors(intro.fromT, intro.toT, EASE.io(clamp(intro.t / intro.dur * 1.1, 0, 1)));
    camera.lookAt(tg);
    if (intro.t > 1.4) document.getElementById('title').classList.add('show');
    if (intro.t >= intro.dur) { intro.on = false; controls.target.copy(intro.toT); controls.enabled = true; }
  } else controls.update();
  shake = Math.max(0, shake - rdt * 0.25);
  shakeOff.set(rr(-1, 1), rr(-1, 1), rr(-1, 1)).multiplyScalar(shake * (hitstop > 0 ? 1 : 0.6));
  camera.position.add(shakeOff);

  demoStep(dt);
  composer.render();
  if (firstFrame) { firstFrame = false; document.getElementById('loading').classList.add('gone'); setTimeout(() => say(LINES.normal, 6), 1800); }
}
frame();

window.LUNA = { A, P, rig, play, setMode, pose, camera, controls, skipIntro, get mode() { return mode; }, get T() { return T; }, intro, scene, applyPose, cur };
</script>
</body>
</html>
