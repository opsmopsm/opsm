<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>OPSM大辞典</title>
<meta name="description" content="OPSM（おぽ）のAI創作をまるごと収めた大辞典。音楽・動画・画像・ストーリー・キャラクター・沿革。">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@600;800;900&family=Zen+Kaku+Gothic+New:wght@400;500;700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="ticker" aria-label="お知らせ"><div class="track" id="ticker"></div></div>
<header class="top">
  <div class="wrap hbar">
    <a class="logo" href="#top" aria-label="OPSM大辞典 トップへ"><span class="mark">OPS<i>M</i></span><span class="sub">AI創作大辞典</span></a>
    <nav class="main" id="nav">
      <a href="#music">音楽</a><a href="#movie">動画</a><a href="#art">画像</a><a href="#story">ストーリー</a><a href="#chara">キャラクター</a><a href="#history">沿革</a><a href="#index">索引</a><a href="#about">OPSMとは</a>
    </nav>
    <button class="search-btn" id="sbtn" type="button" aria-label="大辞典を検索"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg><span>大辞典を検索</span></button>
    <button class="hbtn" id="hbtn" type="button" aria-label="メニューを開く"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M3 7h18M3 12h18M3 17h18"/></svg></button>
  </div>
</header>
<div class="drawer" id="drawer" role="dialog" aria-label="メニュー">
  <button class="x" id="dclose" type="button">閉じる</button>
  <a href="#top">TOP<small>トップ</small></a><a href="#music">MUSIC<small>音楽</small></a><a href="#movie">MOVIE<small>動画</small></a><a href="#art">ART<small>画像</small></a><a href="#story">STORY<small>ストーリー</small></a><a href="#chara">CHARACTER<small>キャラクター</small></a><a href="#history">HISTORY<small>沿革</small></a><a href="#index">INDEX<small>索引</small></a><a href="#about">ABOUT<small>OPSMとは</small></a>
</div>
<main id="app"></main>
<footer>
  <div class="wrap">
    <div class="big">OPS<i>M</i><br>DICTIONARY</div>
    <div class="cols" id="fcols"></div>
    <p>AIと遊び、AIで創り、世界を少しだけ面白くする。</p>
    <small id="fbuilt"></small>
  </div>
</footer>
<div class="player" id="player" aria-label="プレイヤー">
  <div class="prog" id="pprog"><i></i></div>
  <div class="in">
    <img id="pimg" alt="">
    <div class="ti"><b id="ptitle"></b><small id="psub">試聴 30秒</small></div>
    <a class="suno" id="psuno" href="#" target="_blank" rel="noopener">Sunoでフル再生 ↗</a>
    <div class="ctl">
      <button type="button" id="pprev" aria-label="前の曲"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M6 5h2v14H6zM20 5v14L9 12z"/></svg></button>
      <button type="button" class="pp" id="ppp" aria-label="再生・一時停止"></button>
      <button type="button" id="pnext" aria-label="次の曲"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M16 5h2v14h-2zM4 5v14l11-7z"/></svg></button>
      <button type="button" class="rep" id="prep" aria-label="リピート"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M17 2l4 4-4 4"/><path d="M3 11V9a3 3 0 0 1 3-3h15M7 22l-4-4 4-4"/><path d="M21 13v2a3 3 0 0 1-3 3H3"/></svg></button>
    </div>
  </div>
  <audio id="audio" preload="none"></audio>
</div>
<div class="lightbox" id="lb" role="dialog" aria-label="画像の拡大表示">
  <button class="close" type="button" id="lbx">閉じる</button>
  <button class="nav prev" type="button" id="lbp" aria-label="前の画像">‹</button>
  <img id="lbi" alt="">
  <div class="cap" id="lbc"></div>
  <button class="nav next" type="button" id="lbn" aria-label="次の画像">›</button>
</div>
<div class="modal" id="modal" role="dialog" aria-label="キャラクター詳細"><div class="box" id="mbox"></div></div>
<div class="sov" id="sov" role="dialog" aria-label="検索">
  <div class="row"><label class="sr" for="sq">大辞典を検索</label><input id="sq" type="search" placeholder="曲名・キャラ・用語を検索" autocomplete="off"><button class="btn ink" type="button" id="sx">閉じる</button></div>
  <div class="res" id="sres"></div>
</div>
<script src="data.js"></script>
<script src="app.js"></script>
</body>
</html>
