<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>満員電車サバイバー 〜サラリーマン通勤あるある〜</title>
<style>
  :root{ --bg:#16181e; --panel:#252935; --ink:#f3efe6; --accent:#ffcf3f; }
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--bg);color:var(--ink);font-family:"Hiragino Kaku Gothic ProN","Noto Sans JP","Yu Gothic",sans-serif}
  body{display:flex;flex-direction:column;align-items:center;min-height:100vh;padding:12px}
  #wrap{width:100%;max-width:840px}
  canvas{width:100%;aspect-ratio:8/5;display:block;border-radius:12px;background:#2b2f3a;box-shadow:0 8px 30px rgba(0,0,0,.45);touch-action:none}
  #pad{display:flex;justify-content:space-between;align-items:center;margin-top:12px;gap:10px;user-select:none;-webkit-user-select:none}
  .dpad{display:grid;grid-template-columns:repeat(3,56px);grid-template-rows:repeat(2,56px);gap:6px}
  .b{background:var(--panel);color:var(--ink);border:1px solid #3c4252;border-radius:12px;font-size:20px;display:flex;align-items:center;justify-content:center;touch-action:none;cursor:pointer}
  .b:active{background:#3a4152}
  #sp{width:150px;height:118px;font-size:18px;font-weight:bold;background:#3b2f12;border-color:#7a5d17;color:var(--accent);text-align:center;line-height:1.4}
  .help{font-size:12px;opacity:.55;text-align:center;margin-top:8px;line-height:1.7}
  @media (pointer:fine){ #pad{display:none} }
</style>
</head>
<body>
<div id="wrap">
  <canvas id="c"></canvas>
  <div id="pad">
    <div class="dpad">
      <div></div><div class="b" data-k="ArrowUp">▲</div><div></div>
      <div class="b" data-k="ArrowLeft">◀</div><div class="b" data-k="ArrowDown">▼</div><div class="b" data-k="ArrowRight">▶</div>
    </div>
    <div class="b" id="sp" data-k="Space">押す！<br>決定</div>
  </div>
  <div class="help">十字キー：移動・選択　／　スペース：連打・決定　／　1・2・3：選択肢　／　Esc：タイトルへ<br>M：サウンド切替（BGM＋効果音 → 効果音のみ → OFF）　／　H：当たり判定を表示</div>
</div>
<script>
(() => {
'use strict';
// =====================================================================
//  基本セットアップ
// =====================================================================
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
const W = 800, H = 500, PH = 470;
const DPR = Math.min(2, window.devicePixelRatio || 1);
cv.width = W * DPR; cv.height = H * DPR; ctx.scale(DPR, DPR);
const FONT = '"Hiragino Kaku Gothic ProN","Noto Sans JP","Yu Gothic",sans-serif';

// ---------- 入力 ----------
const keys = {}, pressed = {};
const BLOCK = ['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', 'Space'];
addEventListener('keydown', e => {
  if (BLOCK.includes(e.code)) e.preventDefault();
  ac();
  if (!keys[e.code]) pressed[e.code] = true;
  keys[e.code] = true;
});
addEventListener('keyup', e => { keys[e.code] = false; });
addEventListener('blur', () => { for (const k in keys) keys[k] = false; });
document.querySelectorAll('[data-k]').forEach(b => {
  const k = b.dataset.k;
  b.addEventListener('pointerdown', e => { e.preventDefault(); ac(); if (!keys[k]) pressed[k] = true; keys[k] = true; });
  ['pointerup', 'pointerleave', 'pointercancel'].forEach(ev => b.addEventListener(ev, () => { keys[k] = false; }));
});
cv.addEventListener('pointerdown', () => { ac(); if (!keys.Space) pressed.Space = true; });
const hit = k => !!pressed[k];
const go = () => hit('Space') || hit('Enter');

// ---------- 数学 ----------
const rand = (a, b) => a + Math.random() * (b - a);
const randi = (a, b) => Math.floor(rand(a, b + 1));
const pick = a => a[Math.floor(Math.random() * a.length)];
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const lerp = (a, b, t) => a + (b - a) * t;
const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
function shade(hex, amt) {
  const n = parseInt(hex.slice(1), 16);
  const r = clamp((n >> 16) + amt, 0, 255), g = clamp(((n >> 8) & 255) + amt, 0, 255), b = clamp((n & 255) + amt, 0, 255);
  return '#' + ((1 << 24) | (r << 16) | (g << 8) | b).toString(16).slice(1);
}
function pathPos(pts, t) {
  t = clamp(t, 0, 1); const n = pts.length - 1, f = t * n, i = Math.min(Math.floor(f), n - 1), u = f - i;
  return [lerp(pts[i][0], pts[i + 1][0], u), lerp(pts[i][1], pts[i + 1][1], u)];
}

// ---------- 描画ユーティリティ ----------
function rrPath(x, y, w, h, r) {
  r = Math.max(0, Math.min(r, w / 2, h / 2));
  ctx.beginPath(); ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath();
}
function rr(x, y, w, h, r, fill, stroke, lw = 2) {
  if (w <= 0 || h <= 0) return;
  rrPath(x, y, w, h, r);
  if (fill) { ctx.fillStyle = fill; ctx.fill(); }
  if (stroke) { ctx.strokeStyle = stroke; ctx.lineWidth = lw; ctx.stroke(); }
}
function ell(x, y, rx, ry, fill, stroke, lw = 1.5) {
  ctx.beginPath(); ctx.ellipse(x, y, rx, ry, 0, 0, Math.PI * 2);
  if (fill) { ctx.fillStyle = fill; ctx.fill(); }
  if (stroke) { ctx.strokeStyle = stroke; ctx.lineWidth = lw; ctx.stroke(); }
}
function circ(x, y, r, fill, stroke, lw = 1.5) { ell(x, y, r, r, fill, stroke, lw); }
function T(s, x, y, size = 18, color = '#f3efe6', align = 'left', bold = false, outline = null) {
  ctx.font = `${bold ? 'bold ' : ''}${size}px ${FONT}`; ctx.textAlign = align; ctx.textBaseline = 'middle';
  if (outline) { ctx.lineJoin = 'round'; ctx.lineWidth = Math.max(3, size / 5); ctx.strokeStyle = outline; ctx.strokeText(s, x, y); }
  ctx.fillStyle = color; ctx.fillText(s, x, y);
}
function wrapT(s, x, y, maxW, size = 18, color = '#f3efe6', lh = 1.55, align = 'left', bold = false) {
  ctx.font = `${bold ? 'bold ' : ''}${size}px ${FONT}`;
  const lines = []; let line = '';
  for (const ch of s) {
    if (ch === '\n') { lines.push(line); line = ''; continue; }
    if (ctx.measureText(line + ch).width > maxW && line) { lines.push(line); line = ch; } else line += ch;
  }
  if (line) lines.push(line);
  lines.forEach((l, i) => T(l, x, y + i * size * lh, size, color, align, bold));
  return lines.length;
}
function bubble(x, y, s, color = '#ffffff', size = 15) {
  ctx.font = `bold ${size}px ${FONT}`;
  const w = ctx.measureText(s).width + 20, h = size + 13;
  const bx = clamp(x - w / 2, 4, W - w - 4), by = y - h - 9;
  ctx.save(); ctx.shadowColor = 'rgba(0,0,0,.25)'; ctx.shadowBlur = 6; ctx.shadowOffsetY = 2;
  rr(bx, by, w, h, 9, color); ctx.restore();
  ctx.beginPath(); const tx = clamp(x, bx + 10, bx + w - 10);
  ctx.moveTo(tx - 6, by + h - 1); ctx.lineTo(tx + 6, by + h - 1); ctx.lineTo(tx, by + h + 8); ctx.fillStyle = color; ctx.fill();
  T(s, bx + w / 2, by + h / 2 + 1, size, '#222', 'center', true);
}

// =====================================================================
//  サウンド（WebAudio で合成）
// =====================================================================
let AC = null, MASTER = null, NB = null;
function ac() {
  try {
    if (!AC) { AC = new (window.AudioContext || window.webkitAudioContext)(); MASTER = AC.createGain(); MASTER.gain.value = .55; MASTER.connect(AC.destination); }
    if (AC.state === 'suspended') AC.resume();
  } catch (e) {}
  return AC;
}
function tone(f, d = .1, type = 'square', v = .06, slide = 0, delay = 0) {
  if (G.mute || !AC) return;
  const t = AC.currentTime + delay, o = AC.createOscillator(), g = AC.createGain();
  o.type = type; o.frequency.setValueAtTime(f, t);
  if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(40, f + slide), t + d);
  g.gain.setValueAtTime(v, t); g.gain.exponentialRampToValueAtTime(.0001, t + d);
  o.connect(g); g.connect(MASTER); o.start(t); o.stop(t + d + .05);
}
function noise(d = .2, v = .08, delay = 0, freq = 1000, q = .7) {
  if (G.mute || !AC) return;
  if (!NB) { NB = AC.createBuffer(1, AC.sampleRate, AC.sampleRate); const a = NB.getChannelData(0); for (let i = 0; i < a.length; i++) a[i] = Math.random() * 2 - 1; }
  const t = AC.currentTime + delay, s = AC.createBufferSource(), f = AC.createBiquadFilter(), g = AC.createGain();
  s.buffer = NB; f.type = 'bandpass'; f.frequency.value = freq; f.Q.value = q;
  g.gain.setValueAtTime(v, t); g.gain.exponentialRampToValueAtTime(.0001, t + d);
  s.connect(f); f.connect(g); g.connect(MASTER); s.start(t); s.stop(t + d + .05);
}
const SFX = {
  sel: () => tone(900, .05, 'square', .03),
  step: () => tone(320, .04, 'triangle', .04),
  push: () => tone(150, .05, 'square', .035, -60),
  bump: () => { tone(210, .14, 'sawtooth', .06, -140); noise(.09, .07, 0, 420); },
  ok: () => [523, 659, 784, 1046].forEach((f, i) => tone(f, .1, 'square', .04, 0, i * .07)),
  perfect: () => [523, 659, 784, 1046, 1318, 1568].forEach((f, i) => tone(f, .11, 'square', .045, 0, i * .06)),
  ng: () => [392, 311, 247].forEach((f, i) => tone(f, .17, 'triangle', .07, 0, i * .12)),
  pi: () => tone(2050, .09, 'sine', .07),
  pinpon: () => { tone(988, .22, 'sine', .07); tone(784, .35, 'sine', .07, 0, .22); },
  door: () => noise(.5, .06, 0, 2300, .4),
  gatan: () => { noise(.12, .14, 0, 170, 1); noise(.12, .14, .17, 170, 1); },
  bell: () => [659, 784, 880, 784, 659, 523, 587, 659].forEach((f, i) => tone(f, .12, 'triangle', .05, 0, i * .12)),
  warn: () => { tone(700, .07, 'square', .035); tone(700, .07, 'square', .035, 0, .11); },
  coin: () => { tone(1250, .05, 'square', .028); tone(1650, .07, 'square', .028, 0, .05); },
  msg: () => { tone(1320, .06, 'sine', .05); tone(1760, .08, 'sine', .05, 0, .07); },
  stress: () => tone(170, .2, 'sawtooth', .045, -70),
  whoosh: () => noise(.25, .05, 0, 900, .5),
  fanfare: () => [523, 523, 523, 659, 784, 659, 784, 1046].forEach((f, i) => tone(f, i === 7 ? .4 : .13, 'square', .045, 0, [0, .12, .24, .36, .6, .8, .92, 1.1][i])),
};

// ---------- BGM（シンプルなチップチューン・シーケンサー） ----------
const BGM = { song: null, step: 0, next: 0, timer: null, gain: null };
const mtof = n => 440 * Math.pow(2, (n - 69) / 12);
const SONGS = {
  calm: { bpm: 92, prog: [[65, 69, 72], [67, 71, 74], [64, 67, 71], [69, 72, 76]], bass: [1, 0, 0, 0, 0, 0, 2, 0, 1, 0, 0, 0, 0, 0, 2, 0], lead: [1, 0, 3, 0, 2, 0, 0, 5, 0, 3, 0, 2, 0, 0, 0, 0], drums: false, lv: .016 },
  play: { bpm: 140, prog: [[60, 64, 67], [57, 60, 64], [65, 69, 72], [67, 71, 74]], bass: [1, 0, 1, 0, 2, 0, 1, 0, 1, 0, 1, 0, 2, 0, 1, 2], lead: [1, 0, 2, 3, 0, 5, 0, 3, 4, 0, 2, 0, 3, 0, 1, 0], drums: true, lv: .012 },
  happy: { bpm: 122, prog: [[60, 64, 67], [65, 69, 72], [67, 71, 74], [60, 64, 67]], bass: [1, 0, 0, 1, 2, 0, 0, 0, 1, 0, 0, 1, 2, 0, 1, 0], lead: [4, 0, 5, 0, 6, 0, 5, 4, 0, 3, 0, 2, 3, 0, 0, 0], drums: true, lv: .015 },
};
function getNB() { if (!NB) { NB = AC.createBuffer(1, AC.sampleRate, AC.sampleRate); const a = NB.getChannelData(0); for (let i = 0; i < a.length; i++) a[i] = Math.random() * 2 - 1; } return NB; }
function bgmNote(f, t, d, type, v) { const o = AC.createOscillator(), g = AC.createGain(); o.type = type; o.frequency.setValueAtTime(f, t); g.gain.setValueAtTime(v, t); g.gain.exponentialRampToValueAtTime(.0001, t + d); o.connect(g); g.connect(BGM.gain); o.start(t); o.stop(t + d + .05); }
function bgmNoise(t, d, v, freq) { const s = AC.createBufferSource(), f = AC.createBiquadFilter(), g = AC.createGain(); s.buffer = getNB(); f.type = 'highpass'; f.frequency.value = freq; g.gain.setValueAtTime(v, t); g.gain.exponentialRampToValueAtTime(.0001, t + d); s.connect(f); f.connect(g); g.connect(BGM.gain); s.start(t, Math.random() * .5); s.stop(t + d + .05); }
function bgmKick(t) { const o = AC.createOscillator(), g = AC.createGain(); o.type = 'sine'; o.frequency.setValueAtTime(140, t); o.frequency.exponentialRampToValueAtTime(45, t + .12); g.gain.setValueAtTime(.11, t); g.gain.exponentialRampToValueAtTime(.0001, t + .16); o.connect(g); g.connect(BGM.gain); o.start(t); o.stop(t + .2); }
function bgmTick() {
  if (!AC || !BGM.song || AC.state !== 'running') return;
  const song = SONGS[BGM.song], spb = 60 / song.bpm / 4;
  if (BGM.next < AC.currentTime) BGM.next = AC.currentTime + .05;
  while (BGM.next < AC.currentTime + .12) {
    const s = BGM.step, st = s % 16, bar = Math.floor(s / 16), ch = song.prog[bar % song.prog.length], t = BGM.next;
    const b = song.bass[st]; if (b) bgmNote(mtof(ch[0] - 24 + (b === 2 ? 7 : 0)), t, spb * 1.8, 'triangle', .06);
    const l = song.lead[st]; if (l && (bar % 4 !== 3 || st < 8)) bgmNote(mtof(ch[(l - 1) % 3] + (l > 3 ? 12 : 0) + 12), t, spb * 1.4, 'square', song.lv);
    if (song.drums) { if (st % 4 === 0) bgmKick(t); if (st % 4 === 2) bgmNoise(t, .04, .025, 6000); if (st === 4 || st === 12) bgmNoise(t, .12, .045, 1500); }
    BGM.step++; BGM.next += spb;
  }
}
function bgmSet(name) {
  if (!AC) return;
  if (!BGM.gain) { BGM.gain = AC.createGain(); BGM.gain.gain.value = .7; BGM.gain.connect(MASTER); BGM.timer = setInterval(bgmTick, 30); }
  const want = (G.mute || G.bgmOff) ? null : name;
  if (want !== BGM.song) { BGM.song = want; BGM.step = 0; BGM.next = AC.currentTime + .08; }
}

// =====================================================================
//  キャラクター
// =====================================================================
const BODY = ['#7b6a58', '#56715f', '#6f6390', '#8f5555', '#4f6f8a', '#94814a', '#5e5e66', '#86577a', '#3f5a7a', '#a0705a', '#4d7a76', '#77506a', '#8a8f55'];
const SKIN = ['#f2cfa8', '#e8b98f', '#d9a074', '#c08660', '#f6dcc0'];
const HAIRC = ['#231d19', '#3a2a20', '#5a3d2a', '#7a6a5a', '#bdb4aa', '#2a2a35', '#8a5a2a', '#231d19'];
const STYLES = ['short', 'short', 'short', 'long', 'bald', 'bun', 'cap', 'side', 'long'];
const ACCS = ['', '', '', '', '', 'mask', 'glasses', 'phones'];
function look(o = {}) {
  return Object.assign({ body: pick(BODY), skin: pick(SKIN), hairC: pick(HAIRC), style: pick(STYLES), acc: pick(ACCS), capC: pick(['#c05040', '#3a6ea5', '#222', '#d9b33a']) }, o);
}
const HERO_L = { body: '#2c3a5e', skin: '#f2cfa8', hairC: '#231d19', style: 'side', acc: '', hero: true };

function hair(L, hr, hy) {
  const c = L.hairC;
  if (L.style === 'bald') { ctx.fillStyle = 'rgba(255,255,255,.45)'; ctx.beginPath(); ctx.ellipse(-hr * .3, hy - hr * .55, hr * .22, hr * .12, -.5, 0, 7); ctx.fill(); return; }
  if (L.style === 'long') { ctx.fillStyle = c; rr(-hr * 1.04, hy - hr * .3, hr * .42, hr * 1.4, hr * .2, c); rr(hr * .62, hy - hr * .3, hr * .42, hr * 1.4, hr * .2, c); }
  if (L.style === 'cap') {
    ctx.fillStyle = L.capC; ctx.beginPath(); ctx.arc(0, hy, hr * 1.06, Math.PI, 0); ctx.closePath(); ctx.fill();
    ctx.fillStyle = shade(L.capC, -35); rr(-hr * 1.15, hy - hr * .14, hr * 2.3, hr * .26, hr * .1, shade(L.capC, -35));
    return;
  }
  ctx.fillStyle = c; ctx.beginPath(); ctx.arc(0, hy, hr * 1.05, Math.PI, 0);
  ctx.quadraticCurveTo(hr * .55, hy - hr * .6, L.style === 'side' ? -hr * .2 : 0, hy - hr * .38);
  ctx.quadraticCurveTo(-hr * .5, hy - hr * .62, -hr * 1.05, hy); ctx.fill();
  if (L.style === 'bun') circ(0, hy - hr * 1.08, hr * .42, c);
  if (L.style === 'side') { ctx.strokeStyle = shade(c, 40); ctx.lineWidth = Math.max(1, hr / 10); ctx.beginPath(); ctx.moveTo(-hr * .2, hy - hr * .4); ctx.lineTo(-hr * .35, hy - hr * .95); ctx.stroke(); }
}
function angerMark(x, y, s) {
  ctx.strokeStyle = '#e53935'; ctx.lineWidth = s * .28; ctx.lineCap = 'round';
  for (let k = 0; k < 4; k++) {
    const a = k * Math.PI / 2 + Math.PI / 4, cx = x + Math.cos(a) * s * .55, cy = y + Math.sin(a) * s * .55;
    ctx.beginPath(); ctx.arc(cx, cy, s * .38, a + Math.PI * .7, a + Math.PI * 1.3); ctx.stroke();
  }
}
function face(f, hr, hy, L) {
  const ex = hr * .36, ey = hy + hr * .1, s = hr / 10;
  ctx.lineCap = 'round'; ctx.fillStyle = '#1d1a18'; ctx.strokeStyle = '#1d1a18'; ctx.lineWidth = Math.max(1.1, s * 1.05);
  const dot = (x, y, r) => { ctx.beginPath(); ctx.arc(x, y, r, 0, 7); ctx.fill(); };
  const ln = (a, b, c, d) => { ctx.beginPath(); ctx.moveTo(a, b); ctx.lineTo(c, d); ctx.stroke(); };
  const mouthY = hy + hr * .5;
  switch (f) {
    case 'happy':
      ctx.beginPath(); ctx.arc(-ex, ey + s, s * 1.6, Math.PI * 1.1, Math.PI * 1.9); ctx.stroke();
      ctx.beginPath(); ctx.arc(ex, ey + s, s * 1.6, Math.PI * 1.1, Math.PI * 1.9); ctx.stroke();
      ctx.beginPath(); ctx.arc(0, mouthY - s * 1.2, s * 2.2, .15 * Math.PI, .85 * Math.PI); ctx.stroke();
      ctx.fillStyle = 'rgba(255,120,120,.35)'; dot(-ex * 1.5, ey + s * 3, s * 1.6); dot(ex * 1.5, ey + s * 3, s * 1.6); break;
    case 'angry':
      ln(-ex - s * 1.5, ey - s * 3.2, -ex + s * 1.6, ey - s * 1.7); ln(ex + s * 1.5, ey - s * 3.2, ex - s * 1.6, ey - s * 1.7);
      dot(-ex, ey, s * 1.1); dot(ex, ey, s * 1.1);
      ctx.beginPath(); ctx.arc(0, mouthY + s * 1.4, s * 2, 1.15 * Math.PI, 1.85 * Math.PI); ctx.stroke();
      angerMark(hr * .95, hy - hr * .95, hr * .45); break;
    case 'phone': case 'down':
      ln(-ex - s, ey + s * 1.2, -ex + s, ey + s * 1.2); ln(ex - s, ey + s * 1.2, ex + s, ey + s * 1.2);
      ln(-s * .8, mouthY + s * .5, s * .8, mouthY + s * .5); break;
    case 'sleep':
      ctx.beginPath(); ctx.arc(-ex, ey, s * 1.4, .1 * Math.PI, .9 * Math.PI); ctx.stroke();
      ctx.beginPath(); ctx.arc(ex, ey, s * 1.4, .1 * Math.PI, .9 * Math.PI); ctx.stroke();
      ctx.beginPath(); ctx.ellipse(0, mouthY + s * .6, s * .9, s * 1.2, 0, 0, 7); ctx.stroke(); break;
    case 'shock':
      ctx.fillStyle = '#fff'; dot(-ex, ey, s * 2); dot(ex, ey, s * 2); ctx.stroke();
      ctx.beginPath(); ctx.arc(-ex, ey, s * 2, 0, 7); ctx.stroke(); ctx.beginPath(); ctx.arc(ex, ey, s * 2, 0, 7); ctx.stroke();
      ctx.fillStyle = '#1d1a18'; dot(-ex, ey, s * .8); dot(ex, ey, s * .8);
      ctx.beginPath(); ctx.ellipse(0, mouthY + s, s * 1.5, s * 2, 0, 0, 7); ctx.fillStyle = '#5a2020'; ctx.fill(); break;
    case 'sweat': case 'awk':
      if (f === 'awk') { dot(-ex - s * 1.2, ey, s * 1.1); dot(ex - s * 1.2, ey, s * 1.1); } else { dot(-ex, ey, s * 1.1); dot(ex, ey, s * 1.1); }
      ctx.beginPath(); ctx.moveTo(-s * 2, mouthY + s); ctx.quadraticCurveTo(-s, mouthY - s * .3, 0, mouthY + s); ctx.quadraticCurveTo(s, mouthY + s * 2.2, s * 2, mouthY + s); ctx.stroke();
      ctx.fillStyle = '#7fd3ff'; ctx.beginPath(); ctx.moveTo(hr * .85, hy - hr * .6); ctx.quadraticCurveTo(hr * 1.15, hy - hr * .1, hr * .85, hy - hr * .05); ctx.quadraticCurveTo(hr * .6, hy - hr * .1, hr * .85, hy - hr * .6); ctx.fill(); break;
    case 'look':

// =====================================================================
//  メインループ
// =====================================================================
let last = performance.now();
function desiredSong() {
  switch (G.state) {
    case 'title': case 'select': case 'zukan': case 'morning': return 'calm';
    case 'intro': case 'play': case 'result': return G.mode === 'story' && G.queue[G.qi] === 'nap' ? 'calm' : 'play';
    case 'dayclear': case 'weekend': return 'happy';
    default: return null;
  }
}
function applySnd() { G.mute = G.snd === 2; G.bgmOff = G.snd >= 1; try { localStorage.setItem('mansha2_snd', G.snd); } catch (e) {} }
function loop(now) {
  const dt = clamp((now - last) / 1000, 0, .05); last = now; G.t += dt;
  G.dbg = [];
  if (hit('KeyM')) { G.snd = (G.snd + 1) % 3; applySnd(); }
  if (hit('KeyH')) G.debug = !G.debug;
  if (G.tr) { for (const k in pressed) delete pressed[k]; }
  if (hit('Escape') && G.state !== 'title') { if (G.mode === 'story') saveBest(); transition(() => { G.state = 'title'; G.pops = []; }); }

  switch (G.state) {
    case 'title':
      if (hit('ArrowUp')) { G.menu = (G.menu + 3) % 4; SFX.sel(); }
      if (hit('ArrowDown')) { G.menu = (G.menu + 1) % 4; SFX.sel(); }
      if (go()) {
        SFX.sel();
        if (G.menu === 0) transition(newGame);
        else if (G.menu === 1) transition(() => { G.state = 'select'; });
        else if (G.menu === 2) transition(() => { G.state = 'zukan'; G.zpage = 0; });
        else { G.snd = (G.snd + 1) % 3; applySnd(); }
      }
      break;
    case 'select': {
      const n = ORDER.length;
      if (hit('ArrowRight')) { G.sel = (G.sel + 1) % n; SFX.sel(); } if (hit('ArrowLeft')) { G.sel = (G.sel + n - 1) % n; SFX.sel(); }
      if (hit('ArrowDown')) { G.sel = Math.min(n - 1, G.sel + 5); SFX.sel(); } if (hit('ArrowUp')) { G.sel = Math.max(0, G.sel - 5); SFX.sel(); }
      if (go()) { SFX.sel(); const id = ORDER[G.sel]; transition(() => startPractice(id)); }
      break;
    }
    case 'zukan': {
      const pages = Math.ceil(ZUKAN.length / 18);
      if (hit('ArrowRight')) { G.zpage = (G.zpage + 1) % pages; SFX.sel(); } if (hit('ArrowLeft')) { G.zpage = (G.zpage + pages - 1) % pages; SFX.sel(); }
      if (go()) transition(() => { G.state = 'title'; });
      break;
    }
    case 'morning': G.introT += dt; if (go() && G.introT > .3) transition(startStage); break;
    case 'intro': G.introT += dt; if (go() && G.introT > .25) { G.state = 'play'; for (const k in pressed) delete pressed[k]; } break;
    case 'play':
      G.cur.update(dt);
      if (G.state === 'play' && G.stress >= 100) finish(0, 'ストレスが限界を突破した…。');
      break;
    case 'result':
      G.result.t += dt;
      if (G.mode === 'practice' && hit('KeyR') && G.result.t > .5) { transition(() => startPractice(G.queue[0])); break; }
      if (go() && G.result.t > .5) {
        if (G.mode === 'practice') transition(() => { G.state = 'select'; });
        else if (G.stress >= 100) { saveBest(); transition(() => { G.state = 'over'; G.pops = []; }); }
        else if (G.qi < G.queue.length - 1) transition(() => { G.qi++; startStage(); });
        else { saveBest(); transition(() => { G.state = 'dayclear'; G.pops = []; dayClearCheck(); SFX.fanfare(); burst(400, 120, 50, 'confetti'); }); }
      }
      break;
    case 'dayclear':
      if (go()) {
        if (wd() === 4) transition(() => { G.state = 'weekend'; unlock('a:week'); saveBest(); SFX.fanfare(); });
        else transition(() => { G.day++; G.stress = Math.max(0, G.stress - 25); setupDay(); });
      }
      break;
    case 'weekend':
      if (Math.random() < dt * 5) burst(rand(80, 720), rand(30, 200), 10, 'confetti');
      if (go()) transition(() => { G.day++; G.stress = 0; G.weekPerf = 0; G.weekScore0 = G.score; setupDay(); });
      break;
    case 'over': if (go()) transition(() => { G.state = 'title'; }); break;
  }
  bgmSet(desiredSong());

  if (G.tr) { G.tr.a += dt * 4.5 * G.tr.dir; if (G.tr.dir === 1 && G.tr.a >= 1) { G.tr.a = 1; G.tr.fn(); G.tr.dir = -1; } else if (G.tr.dir === -1 && G.tr.a <= 0) G.tr = null; }
  G.pops.forEach(p => { p.life -= dt; p.y -= 32 * dt; }); G.pops = G.pops.filter(p => p.life > 0);
  for (const p of G.parts) { p.vy += (p.kind === 'confetti' ? 360 : 650) * dt; p.vx *= Math.pow(.5, dt); p.x += p.vx * dt; p.y += p.vy * dt; p.life -= dt; p.rot += dt * 9; }
  G.parts = G.parts.filter(p => p.life > 0);
  if (G.toasts.length) { G.toasts[0].life -= dt; if (G.toasts[0].life <= 0) G.toasts.shift(); }
  G.shake = Math.max(0, G.shake - dt); G.flash = Math.max(0, G.flash - dt);

  // ---- 描画 ----
  ctx.save();
  if (G.shake > 0 && (G.state === 'play' || G.state === 'result')) ctx.translate(rand(-5, 5) * G.shake * 3, rand(-5, 5) * G.shake * 3);
  ctx.fillStyle = '#2b2f3a'; ctx.fillRect(-20, -20, W + 40, H + 40);
  switch (G.state) {
    case 'title': drawTitle(); break;
    case 'select': drawSelect(); break;
    case 'zukan': drawZukan(); break;
    case 'morning': drawMorning(); break;
    case 'intro': drawIntro(); break;
    case 'play': G.cur.draw(); bottomBar(); break;
    case 'result': drawResult(); bottomBar(); break;
    case 'dayclear': drawDayClear(); break;
    case 'weekend': drawWeekend(); break;
    case 'over': drawOver(); break;
  }
  if (G.debug && G.state === 'play') {
    ctx.save(); ctx.strokeStyle = '#ff2fd0'; ctx.lineWidth = 1.5; ctx.setLineDash([3, 2]);
    for (const b of G.dbg) { if (b.rect) ctx.strokeRect(b.x, b.y, b.w, b.h); else { ctx.beginPath(); ctx.ellipse(b.x, b.y, b.rx, b.ry, 0, 0, 7); ctx.stroke(); } }
    ctx.restore(); T('当たり判定表示中（H）', 10, 12, 12, '#ff2fd0', 'left', true, '#000');
  }
  if (G.flash > 0 && G.state === 'play') { const g = ctx.createRadialGradient(W / 2, H / 2, 150, W / 2, H / 2, 520); g.addColorStop(0, 'rgba(255,0,0,0)'); g.addColorStop(1, `rgba(255,40,40,${G.flash})`); ctx.fillStyle = g; ctx.fillRect(0, 0, W, H); }
  for (const p of G.parts) {
    ctx.globalAlpha = clamp(p.life * 2, 0, 1);
    if (p.kind === 'confetti') { ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.rot); ctx.fillStyle = p.c; ctx.fillRect(-p.r, -p.r * .5, p.r * 2, p.r); ctx.restore(); }
    else { ctx.fillStyle = p.c; ctx.beginPath(); ctx.ellipse(p.x, p.y, p.r * .7, p.r, 0, 0, 7); ctx.fill(); }
    ctx.globalAlpha = 1;
  }
  for (const p of G.pops) { ctx.globalAlpha = clamp(p.life * 1.4, 0, 1); T(p.s, p.x, p.y, p.size, p.c, 'center', true, 'rgba(0,0,0,.75)'); ctx.globalAlpha = 1; }
  if (G.toasts.length) {
    const ts = G.toasts[0], k = Math.min(1, (2.6 - ts.life) * 5, ts.life * 4), y = -26 + k * 52;
    const msg = '📖 あるある図鑑に追加：' + ts.s; ctx.font = `bold 14px ${FONT}`; const w = Math.min(780, ctx.measureText(msg).width + 40);
    rr(W / 2 - w / 2, y - 16, w, 32, 16, 'rgba(32,27,10,.95)', '#ffcf3f', 2); T(msg, W / 2, y, 14, '#ffe08a', 'center', true);
  }
  if (G.snd > 0) T(G.snd === 2 ? '🔇' : 'BGM OFF', 784, 12, 11, '#ccc', 'right', true);
  ctx.restore();
  if (G.tr) { ctx.fillStyle = `rgba(10,11,14,${G.tr.a})`; ctx.fillRect(0, 0, W, H); }

  for (const k in pressed) delete pressed[k];
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);

// テスト用フック

})();
