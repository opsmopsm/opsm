<script>
  // オープニングは1セッションに1回（トップから入ったときだけ）
  (function(){
    var h = location.hash.replace('#','');
    var reduce = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
    var seen = false; try { seen = sessionStorage.getItem('opsm-intro') === '1'; } catch(e){}
    if ((h === '' || h === 'top') && !seen && !reduce) document.documentElement.classList.add('intro-on');
  })();
</script>

<body>

<!-- ===== オープニング：モモンガについて森をぬける ===== -->

    <div class="wall" id="wall"><div class="hole"></div></div>
    <div class="ground"></div>
    <div class="mm" id="mm"></div>

    <div class="gasa" id="gasa">ガサッ</div>
    <div class="burst" id="burst"></div>
  </div>
  <div class="rush" id="rush"></div>
  <div class="flash"></div>
  <button class="skip" id="skip" type="button">スキップ ▶</button>
</div>

<header class="top">
  <div class="wrap hbar">
    <a class="logo" href="#top" aria-label="OPSMの森の秘密基地 トップへ">

  </div>
</header>

  <a href="#top">トップ<small>TOP</small></a>
  <a href="#music">AI音楽<small>全曲リスト・ペルソナ</small></a>

<main id="app"></main>

<footer>
  <div class="wrap">
    <div class="fmm" id="fmm"></div>
    <div class="big">OPS<i>M</i>の森の秘密基地</div>

  </div>

<div class="player" id="player" aria-label="プレイヤー">
  <div class="prog" id="pprog"><i></i></div>
  <div class="in">

    <span class="eq" aria-hidden="true"><i></i><i></i><i></i></span><div class="ti"><b id="ptitle"></b><small id="psub">試聴 30秒</small></div>

    <div class="ctl">
      <button type="button" id="pprev" aria-label="前の曲"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M6 5h2v14H6zM20 5v14L9 12z"/></svg></button>

</div>
