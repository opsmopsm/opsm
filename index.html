<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>OPSM ROULETTE｜おぽのAI創作</title>
<meta name="description" content="OPSM（おぽ）のAI創作サイト。ルーレットを回して、AI音楽・AI画像・AI動画・AI漫画・AIゲーム・キャラクター・ストーリーへ。">
<meta property="og:title" content="OPSM ROULETTE｜おぽのAI創作">
<meta property="og:description" content="何が出るかは回してのお楽しみ。OPSMのAI創作ルーレット。">
<meta property="og:image" content="https://opsmopsm.github.io/opsm/img/ogp.webp">
<link rel="icon" href="daijiten/g/8d80b48e47.webp">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;700&family=Zen+Kaku+Gothic+New:wght@500;700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="roulette.css">
<script type="importmap">{"imports":{"three":"./lib/three.module.min.js"}}</script>
</head>
<body class="is-top">

<header class="top">
  <div class="wrap hbar">
    <a class="logo" href="#top" aria-label="OPSM トップへ"><span class="mk">OPS<i>M</i></span><span class="sub">ROULETTE</span></a>
    <nav class="main" id="nav"></nav>
    <button class="hbtn" id="hbtn" type="button" aria-label="メニューを開く"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M3 7h18M3 12h18M3 17h18"/></svg></button>
  </div>
</header>
<div class="drawer" id="drawer" role="dialog" aria-label="メニュー">
  <button class="x" id="dclose" type="button">閉じる</button>
  <div id="dlist"></div>
</div>

<!-- ===== トップ：3Dルーレット ===== -->
<section class="stage" id="stage">
  <canvas id="wheel" aria-label="OPSMルーレット。コーナーを押すとそのページへ移動します"></canvas>
  <div class="ui">
    <span class="en">OPSM — AI Creative Roulette</span>
    <h1>何が出るかは、<br><em>回して</em>のお楽しみ。</h1>
    <p>AIで曲を作り、絵を描き、動画を撮り、漫画とゲームも。<br>おぽの創作ぜんぶを、ルーレットにのせました。</p>
    <button class="spin" id="spin" type="button">SPIN ▶</button>
    <div class="quick" id="quick"></div>
  </div>
  <div class="result" id="result" role="dialog" aria-live="polite">
    <button class="x" id="rx" type="button" aria-label="閉じる">×</button>
    <span class="en">Winner</span>
    <div class="rno num" id="rno"></div>
    <b id="rt"></b>
    <p id="rd"></p>
    <div class="rb"><a class="btn gold" id="rgo" href="#">このテーブルへ →</a><button class="btn" id="ragain" type="button">もう一回</button></div>
  </div>
  <div class="scroll">SCROLL ↓</div>
</section>

<main id="app"></main>

<footer>
  <div class="wrap">
    <div class="big">OPS<i>M</i> ROULETTE</div>
    <p>AIと遊び、AIで創り、世界を少しだけ面白くする。</p>
    <div class="cols" id="fcols"></div>
    <p class="small"><a href="daijiten/">OPSM大辞典</a>　<a href="old.html">旧サイト</a></p>
    <small id="fbuilt"></small>
  </div>
</footer>

<div class="player" id="player" aria-label="プレイヤー">
  <div class="prog" id="pprog"><i></i></div>
  <div class="in">
    <img id="pimg" alt="">
    <div class="ti"><b id="ptitle"></b><small id="psub">試聴 30秒</small></div>
    <a class="suno" id="psuno" href="#" target="_blank" rel="noopener">Sunoでフル再生 ↗</a>
    <div class="ctl">
      <button type="button" id="pprev" aria-label="前の曲"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M6 5h2v14H6zM20 5v14L9 12z"/></svg></button>
      <button type="button" class="pp" id="ppp" aria-label="再生・一時停止"></button>
      <button type="button" id="pnext" aria-label="次の曲"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M16 5h2v14h-2zM4 5v14l11-7z"/></svg></button>
      <button type="button" id="pclose" aria-label="プレイヤーを閉じる"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></svg></button>
    </div>
  </div>
  <audio id="audio" preload="none"></audio>
</div>

<div class="lightbox" id="lb" role="dialog" aria-label="画像の拡大表示">
  <button class="close" type="button" id="lbx">閉じる</button>
  <button class="nav prev" type="button" id="lbp" aria-label="前の画像">‹</button>
  <img id="lbi" alt="">
  <div class="cap" id="lbc"></div>
  <button class="nav next" type="button" id="lbn" aria-label="次の画像">›</button>
</div>
<div class="modal" id="modal" role="dialog" aria-label="キャラクター詳細"><div class="box" id="mbox"></div></div>

<script>
// ルーレットの10コーナー（この順番で盤に並びます）
window.SECTIONS = [
  { k: 'music',  t: 'AI音楽',     en: 'MUSIC',     d: '全曲リストとペルソナ' },
  { k: 'image',  t: 'AI画像',     en: 'IMAGE',     d: 'ギャラリーと投稿作品' },
  { k: 'video',  t: 'AI動画',     en: 'VIDEO',     d: 'MV・ショート・制作中' },
  { k: 'manga',  t: 'AI漫画',     en: 'MANGA',     d: 'AIで描く漫画' },
  { k: 'game',   t: 'AIゲーム',   en: 'GAME',      d: 'ブラウザで遊べる' },
  { k: 'chara',  t: 'キャラクター', en: 'CHARACTER', d: 'なかまたちの図鑑' },
  { k: 'story',  t: 'ストーリー', en: 'STORY',     d: '曲から生まれた物語' },
  { k: 'about',  t: 'OPSMとは',   en: 'ABOUT',     d: '自己紹介と沿革' },
  { k: 'links',  t: 'リンク',     en: 'LINKS',     d: 'Suno・YouTube・note' },
  { k: 'topics', t: 'トピック',   en: 'TOPICS',    d: '最近のできごと' },
];
(function(){
  var S = window.SECTIONS;
  document.getElementById('nav').innerHTML = S.map(function(s){ return '<a href="#' + s.k + '">' + s.t + '</a>'; }).join('');
  document.getElementById('dlist').innerHTML = '<a href="#top">トップ<small>ROULETTE</small></a>' + S.map(function(s){ return '<a href="#' + s.k + '">' + s.t + '<small>' + s.en + '</small></a>'; }).join('');
})();
</script>
<script src="daijiten/data.js"></script>
<script src="roulette.js"></script>
<script type="module" src="wheel.js"></script>
</body>
</html>
