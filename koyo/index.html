<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>紅葉ノ異界 — ドット</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DotGothic16&display=swap" rel="stylesheet">
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #05060c; color: #f4e9dc; font-family: "DotGothic16", "MS Gothic", monospace; -webkit-user-select: none; user-select: none; }
  #stage canvas { display: block; touch-action: none; cursor: grab; image-rendering: pixelated; image-rendering: crisp-edges; }
  #stage canvas:active { cursor: grabbing; }
  #loading { position: fixed; inset: 0; display: grid; place-items: center; background: #0b0a1a; z-index: 20; transition: opacity 1.2s steps(6), visibility 1.2s; }
  #loading.done { opacity: 0; visibility: hidden; }
  #loading .t { text-align: center; letter-spacing: .4em; }
  #loading h1 { font-weight: 400; font-size: clamp(26px, 4vw, 44px); margin: 0 0 18px; color: #ffc34a; text-shadow: 3px 3px 0 #a81c1c; }
  #progress { font-size: 13px; opacity: .65; letter-spacing: .3em; }
  .leaf { width: 8px; height: 8px; margin: 26px auto 0; background: #f04a24; box-shadow: 8px 0 #f04a24, -8px 0 #f04a24, 0 -8px #f04a24, 0 8px #7a1420, 8px -8px #ff9e3a, -8px -8px #ff9e3a; animation: blink 1s steps(2) infinite; }
  @keyframes blink { 50% { opacity: .3; } }
  #title { position: fixed; left: max(28px, env(safe-area-inset-left)); top: max(24px, env(safe-area-inset-top)); z-index: 5; pointer-events: none; transition: opacity 2s; }
  #title h2 { margin: 0; font-weight: 400; font-size: clamp(18px, 2.2vw, 26px); letter-spacing: .3em; color: #ffe08a; text-shadow: 2px 2px 0 #4f0f1a, -1px -1px 0 #0b0a1a; }
  #title p { margin: 6px 0 0; font-size: 11px; letter-spacing: .3em; color: #f2b8c8; text-shadow: 1px 1px 0 #0b0a1a; }
  #hint { position: fixed; left: 50%; top: 56%; transform: translate(-50%, -50%); font-size: 14px; letter-spacing: .25em; color: #fff4d6; z-index: 5; pointer-events: none; text-shadow: 2px 2px 0 #0b0a1a; transition: opacity 1s steps(4); animation: blink 1.2s steps(2) infinite; }
  body.touched #hint { opacity: 0; }
  #ui { position: fixed; left: 50%; bottom: max(22px, env(safe-area-inset-bottom)); transform: translateX(-50%); z-index: 6; display: flex; gap: 14px; flex-wrap: wrap; justify-content: center; opacity: .82; transition: opacity .4s; width: max-content; max-width: 94vw; }
  #ui:hover { opacity: 1; }
  .grp { display: flex; gap: 4px; padding: 4px; background: #1a1636; box-shadow: 0 -4px 0 #0b0a1a, 0 4px 0 #0b0a1a, -4px 0 0 #0b0a1a, 4px 0 0 #0b0a1a, inset 0 0 0 2px #3e3470; }
  .grp button { all: unset; cursor: pointer; padding: 7px 12px; font-size: 14px; letter-spacing: .1em; color: #fff4d6; white-space: nowrap; }
  .grp button:hover { background: #3e3470; }
  .grp button.on { background: #d4301e; color: #ffe08a; box-shadow: inset 0 -3px 0 #7a1420, inset 0 3px 0 #f04a24; }
  .grp button.on::before { content: '▶'; margin-right: 4px; font-size: 10px; }
  @media (max-width: 640px) { .grp button { padding: 7px 10px; font-size: 12px; letter-spacing: .1em; } #ui { gap: 6px; } }
</style>
</head>
<body>
<div id="loading"><div class="t"><h1>紅葉ノ異界</h1><div id="progress">準備しています…</div><div class="leaf"></div></div></div>
<div id="stage"></div>
<div id="title"><h2>紅葉ノ異界</h2><p>KOYO · PIXEL OTHERWORLD</p></div>
<div id="hint">ドラッグで 360° 見わたす</div>
<div id="ui">
  <div class="grp"><button data-mood="dusk">黄昏</button><button data-mood="twilight">宵</button><button data-mood="night">夜</button></div>
  <div class="grp"><button data-view="lake">湖畔</button><button data-view="bridge">橋の上</button><button data-view="grove">樹の下</button></div>
  <div class="grp"><button data-pix="fine">細</button><button data-pix="mid">中</button><button data-pix="coarse">粗</button></div>
  <div class="grp"><button id="sound">音 OFF</button><button id="fs">全画面</button></div>
</div>
